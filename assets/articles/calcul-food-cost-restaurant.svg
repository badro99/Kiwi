<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Food cost restaurant · formule et exemple en MAD</title>
  <desc id="desc">Couverture Kiwi noire et verte présentant le calcul 20,50 divisé par 75 égale 27,3 pour cent.</desc>
  <defs>
    <radialGradient id="glow" cx="76%" cy="36%" r="66%"><stop offset="0" stop-color="#00ffae" stop-opacity=".30"/><stop offset="1" stop-color="#00ffae" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#F7F5F0" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0A0F0D"/><rect width="1200" height="630" fill="url(#glow)"/><rect x="730" width="470" height="630" fill="url(#grid)"/>
  <g font-family="Inter Tight, Inter, Arial, sans-serif">
    <circle cx="77" cy="68" r="7" fill="#00ffae"/><text x="98" y="75" fill="#00ffae" font-size="16" font-weight="500" letter-spacing="2">KIWI GUIDES · MARGE</text>
    <text x="70" y="202" fill="#F7F5F0" font-size="66" font-weight="500" letter-spacing="-3.5">Food cost restaurant :</text>
    <text x="70" y="278" fill="#00ffae" font-size="66" font-weight="500" letter-spacing="-3.5">du plat au réel.</text>
    <text x="72" y="542" fill="#F7F5F0" fill-opacity=".68" font-size="21">Formule · rendement · inventaire · exemple en MAD</text>
    <g transform="translate(790 105)">
      <rect width="340" height="398" rx="30" fill="#0A0F0D" fill-opacity=".78" stroke="#F7F5F0" stroke-opacity=".18"/>
      <text x="28" y="51" fill="#F7F5F0" fill-opacity=".52" font-size="13" letter-spacing="1.3">COÛT PAR PORTION</text>
      <text x="28" y="130" fill="#F7F5F0" font-size="58" font-weight="400">20,50</text><text x="260" y="130" fill="#F7F5F0" fill-opacity=".48" font-size="18">MAD</text>
      <path d="M28 163H312" stroke="#F7F5F0" stroke-opacity=".18"/>
      <text x="28" y="215" fill="#F7F5F0" fill-opacity=".58" font-size="23">÷ 75,00 MAD</text>
      <path d="M28 248H312" stroke="#F7F5F0" stroke-opacity=".18"/>
      <text x="28" y="326" fill="#00ffae" font-size="72" font-weight="500" letter-spacing="-3">27,3%</text>
      <text x="30" y="365" fill="#F7F5F0" fill-opacity=".46" font-size="13">EXEMPLE PÉDAGOGIQUE</text>
    </g>
  </g>
</svg>
