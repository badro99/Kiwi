<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kiwi Guides · gestion de restaurant au Maroc</title>
  <desc id="desc">Couverture Kiwi noire et verte présentant trois guides sur la caisse, la marge et le stock.</desc>
  <defs><radialGradient id="glow" cx="50%" cy="24%" r="78%"><stop offset="0" stop-color="#00ffae" stop-opacity=".27"/><stop offset="1" stop-color="#00ffae" stop-opacity="0"/></radialGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#F7F5F0" stroke-opacity=".07"/></pattern></defs>
  <rect width="1200" height="630" fill="#0A0F0D"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Inter Tight, Inter, Arial, sans-serif">
    <circle cx="77" cy="68" r="7" fill="#00ffae"/><text x="98" y="75" fill="#00ffae" font-size="16" font-weight="500" letter-spacing="2">KIWI GUIDES · MAROC</text>
    <text x="70" y="174" fill="#F7F5F0" font-size="66" font-weight="500" letter-spacing="-4"><tspan x="70">Décider, compter</tspan><tspan x="70" dy="70" fill="#00ffae">et mieux servir.</tspan></text>
    <g transform="translate(70 330)">
      <g><rect width="330" height="205" rx="24" fill="#0A0F0D" fill-opacity=".78" stroke="#F7F5F0" stroke-opacity=".17"/><text x="24" y="40" fill="#00ffae" font-size="13">01 · DÉCIDER</text><text x="24" y="91" fill="#F7F5F0" font-size="28">Choisir sa caisse</text><text x="24" y="137" fill="#F7F5F0" fill-opacity=".52" font-size="15">7 tests · 60 minutes</text><text x="24" y="174" fill="#F7F5F0" fill-opacity=".38" font-size="12">SERVICE · RÉSEAU · DONNÉES</text></g>
      <g transform="translate(365)"><rect width="330" height="205" rx="24" fill="#0A0F0D" fill-opacity=".78" stroke="#F7F5F0" stroke-opacity=".17"/><text x="24" y="40" fill="#00ffae" font-size="13">02 · MESURER</text><text x="24" y="91" fill="#F7F5F0" font-size="28">Calculer la marge</text><text x="24" y="137" fill="#F7F5F0" fill-opacity=".52" font-size="15">Food cost · MAD</text><text x="24" y="174" fill="#F7F5F0" fill-opacity=".38" font-size="12">RECETTE · RÉEL · ÉCART</text></g>
      <g transform="translate(730)"><rect width="330" height="205" rx="24" fill="#0A0F0D" fill-opacity=".78" stroke="#F7F5F0" stroke-opacity=".17"/><text x="24" y="40" fill="#00ffae" font-size="13">03 · EXPLIQUER</text><text x="24" y="91" fill="#F7F5F0" font-size="28">Gérer le stock</text><text x="24" y="137" fill="#F7F5F0" fill-opacity=".52" font-size="15">Quantité · mouvement</text><text x="24" y="174" fill="#F7F5F0" fill-opacity=".38" font-size="12">ATTENDU · COMPTÉ · RÉASSORT</text></g>
    </g>
  </g>
</svg>
