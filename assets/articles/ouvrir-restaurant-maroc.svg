      <g font-size="15"><circle cx="62" cy="106" r="17" fill="#00ffae" fill-opacity=".16" stroke="#00ffae"/><text x="62" y="112" text-anchor="middle" fill="#00ffae" font-weight="700">01</text><text x="98" y="111" fill="#F7F5F0">Projet défini</text>
