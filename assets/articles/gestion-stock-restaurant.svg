<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gestion de stock restaurant · méthode et exemple</title>
  <desc id="desc">Couverture Kiwi noire et verte comparant le stock attendu au stock compté.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="24%" r="70%"><stop offset="0" stop-color="#00ffae" stop-opacity=".28"/><stop offset="1" stop-color="#00ffae" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#F7F5F0" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0A0F0D"/><rect width="1200" height="630" fill="url(#glow)"/><rect x="750" width="450" height="630" fill="url(#grid)"/>
  <g font-family="Inter Tight, Inter, Arial, sans-serif">
    <circle cx="77" cy="68" r="7" fill="#00ffae"/><text x="98" y="75" fill="#00ffae" font-size="16" font-weight="500" letter-spacing="2">KIWI GUIDES · STOCK</text>
    <text x="70" y="190" fill="#F7F5F0" font-size="62" font-weight="500" letter-spacing="-3.2">Gestion de stock</text>
    <text x="70" y="260" fill="#F7F5F0" font-size="62" font-weight="500" letter-spacing="-3.2">restaurant :</text>
    <text x="70" y="330" fill="#00ffae" font-size="62" font-weight="500" letter-spacing="-3.2">expliquer l’écart.</text>
    <text x="72" y="532" fill="#F7F5F0" fill-opacity=".68" font-size="21">Unités · mouvements · inventaire · réassort</text>
    <g transform="translate(805 98)">
      <rect width="325" height="430" rx="28" fill="#0A0F0D" fill-opacity=".78" stroke="#F7F5F0" stroke-opacity=".18"/>
      <text x="26" y="49" fill="#F7F5F0" fill-opacity=".52" font-size="13" letter-spacing="1.3">POULET · EXEMPLE</text>
      <g transform="translate(26 83)"><text y="22" fill="#F7F5F0" fill-opacity=".58" font-size="14">Stock attendu</text><text x="273" y="26" text-anchor="end" fill="#F7F5F0" font-size="27">23,4 kg</text><rect y="42" width="273" height="12" rx="6" fill="#F7F5F0" fill-opacity=".12"/><rect y="42" width="252" height="12" rx="6" fill="#00ffae" fill-opacity=".70"/></g>
      <g transform="translate(26 176)"><text y="22" fill="#F7F5F0" fill-opacity=".58" font-size="14">Stock compté</text><text x="273" y="26" text-anchor="end" fill="#F7F5F0" font-size="27">21,9 kg</text><rect y="42" width="273" height="12" rx="6" fill="#F7F5F0" fill-opacity=".12"/><rect y="42" width="236" height="12" rx="6" fill="#F7F5F0" fill-opacity=".48"/></g>
      <path d="M26 275H299" stroke="#F7F5F0" stroke-opacity=".18"/>
      <text x="26" y="324" fill="#F7F5F0" fill-opacity=".58" font-size="14">Écart valorisé</text><text x="26" y="386" fill="#00ffae" font-size="62" font-weight="500" letter-spacing="-3">−63 MAD</text>
    </g>
  </g>
