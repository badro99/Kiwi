<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">فتح مطعم في المغرب</title>
  <desc id="desc">لوحة تحضير تربط المشروع والمحل والإجراءات وتجربة الخدمة.</desc>
  <defs><radialGradient id="glow" cx="22%" cy="42%" r="72%"><stop offset="0" stop-color="#00ffae" stop-opacity=".28"/><stop offset="1" stop-color="#00ffae" stop-opacity="0"/></radialGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#F7F5F0" stroke-opacity=".07"/></pattern></defs>
  <rect width="1200" height="630" fill="#0A0F0D"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="490" height="630" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif" direction="rtl"><circle cx="1123" cy="68" r="7" fill="#00ffae"/><text x="1102" y="75" text-anchor="end" fill="#00ffae" font-size="16" font-weight="500">أدلة KIWI · حضّر</text>
    <text x="1130" y="196" text-anchor="end" fill="#F7F5F0" font-size="54" font-weight="500">فتح مطعم</text><text x="1130" y="264" text-anchor="end" fill="#00ffae" font-size="54" font-weight="500">في المغرب.</text>
    <text x="1130" y="538" text-anchor="end" fill="#F7F5F0" fill-opacity=".68" font-size="20">٩ نقاط قبل عقد الكراء · مثال بالدرهم</text>
    <g transform="translate(70 98)"><rect width="382" height="410" rx="30" fill="#0A0F0D" fill-opacity=".84" stroke="#F7F5F0" stroke-opacity=".18"/><text x="354" y="43" text-anchor="end" fill="#F7F5F0" fill-opacity=".5" font-size="12">فحص قبل الالتزام</text><path d="M320 104V326" stroke="#F7F5F0" stroke-opacity=".18" stroke-width="2"/>
      <g font-size="15"><circle cx="320" cy="106" r="17" fill="#00ffae" fill-opacity=".16" stroke="#00ffae"/><text x="320" y="112" text-anchor="middle" fill="#00ffae" font-weight="700" direction="ltr">01</text><text x="284" y="111" text-anchor="end" fill="#F7F5F0">تحديد المشروع</text><circle cx="320" cy="180" r="17" fill="#00ffae" fill-opacity=".16" stroke="#00ffae"/><text x="320" y="186" text-anchor="middle" fill="#00ffae" font-weight="700" direction="ltr">02</text><text x="284" y="185" text-anchor="end" fill="#F7F5F0">فحص المحل</text><circle cx="320" cy="254" r="17" fill="#00ffae" fill-opacity=".16" stroke="#00ffae"/><text x="320" y="260" text-anchor="middle" fill="#00ffae" font-weight="700" direction="ltr">03</text><text x="284" y="259" text-anchor="end" fill="#F7F5F0">تأكيد الإجراءات</text><circle cx="320" cy="328" r="17" fill="#00ffae"/><text x="320" y="334" text-anchor="middle" fill="#0A0F0D" font-weight="700" direction="ltr">04</text><text x="284" y="333" text-anchor="end" fill="#F7F5F0">تجربة الخدمة</text></g>
      <rect x="28" y="366" width="326" height="1" fill="#F7F5F0" fill-opacity=".13"/><text x="354" y="392" text-anchor="end" fill="#F7F5F0" fill-opacity=".55" font-size="12">المحل ← السلطات ← الفريق ← الافتتاح</text></g>
