<!-- Espace comptable : la page qu'ouvre l'expert-comptable d'un commerçant.
     Lecture seule (GET /api/comptable/books), aucun compte Kiwi. Le jeton du
     lien arrive dans le fragment (#), il est échangé une fois contre un cookie
     HttpOnly (POST /api/comptable/session) puis effacé de l'adresse. Les exports
     CSV sont fabriqués ici, dans le navigateur, à partir du JSON reçu. -->
<style>
  :root {
    --cp-line: rgba(10, 15, 13, 0.12);
    --cp-line-soft: rgba(10, 15, 13, 0.07);
    --cp-muted: #5c5a54;
    --cp-card: var(--surface, #FFFDFA);
    --cp-radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; font-style: normal;
  }
  html[lang="ar"] body, html[lang="ar"] button, html[lang="ar"] input, html[lang="ar"] select {
    font-family: "IBM Plex Sans Arabic", "Inter Tight", system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  i[data-icon], svg[data-material-symbol] { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -0.22em; flex: none; }
  .cp-wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 56px; }
  .num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.92em; }

  /* ── En-tête ── */
  .cp-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 18px 0 14px; }
  .cp-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cp-brand img { width: 30px; height: 30px; border-radius: 8px; flex: none; }
  .cp-brand-name { font-weight: 600; letter-spacing: -0.01em; }
  .cp-brand-sub { color: var(--cp-muted); font-size: 13px; }
  .cp-spacer { flex: 1 1 auto; }
  .cp-lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--paper-soft); border: 1px solid var(--cp-line-soft); }
  .cp-lang button { border: 0; background: transparent; padding: 6px 12px; min-height: 32px; min-width: 40px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--cp-muted); }
  .cp-lang button.on { color: var(--paper); }
  .cp-lang button:focus-visible, .cp-btn:focus-visible, .cp-iconbtn:focus-visible, .cp-month input:focus-visible { outline: 2px solid var(--atlas); outline-offset: 2px; }

  .cp-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px; padding: 10px 0 18px; }
  .cp-head h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); font-weight: 500; letter-spacing: -0.03em; line-height: 1.08; overflow-wrap: anywhere; }
  .cp-head .cp-kicker { color: var(--atlas); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 4px; }
  .cp-month { display: flex; align-items: center; gap: 6px; }
  .cp-month input { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--cp-line); background: var(--cp-card); min-width: 150px; }
  .cp-iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--cp-line); background: var(--cp-card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .cp-iconbtn:hover { background: var(--paper-soft); }
  html[dir="rtl"] .cp-iconbtn i[data-icon], html[dir="rtl"] .cp-iconbtn svg { transform: scaleX(-1); }

  .cp-ro { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--paper-soft); border: 1px solid var(--cp-line-soft); color: var(--n-700, #2E2D29); font-size: 14px; }
  .cp-ro i, .cp-ro svg { color: var(--atlas); margin-top: 2px; }
  .cp-ro b { font-weight: 600; }

  /* ── Cartes ── */
  .cp-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0 8px; }
  .cp-stat { background: var(--cp-card); border: 1px solid var(--cp-line-soft); border-radius: var(--cp-radius); padding: 16px; box-shadow: var(--elev-1); min-width: 0; }
  .cp-stat .l { color: var(--cp-muted); font-size: 13px; }
  .cp-stat .v { font-size: clamp(22px, 3.2vw, 30px); font-weight: 500; letter-spacing: -0.03em; margin-top: 4px; overflow-wrap: anywhere; }
  .cp-stat .s { color: var(--cp-muted); font-size: 12.5px; margin-top: 2px; }
  .cp-stat.main { background: var(--riad); border-color: transparent; color: var(--paper); }
  .cp-stat.main .l, .cp-stat.main .s { color: rgba(247, 245, 240, 0.72); }
  .cp-card { background: var(--cp-card); border: 1px solid var(--cp-line-soft); border-radius: var(--cp-radius); padding: 18px; margin-top: 14px; box-shadow: var(--elev-1); min-width: 0; }
  .cp-card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  .cp-card .sub { color: var(--cp-muted); font-size: 13px; margin: 0 0 12px; }
  .cp-methods { display: grid; gap: 10px; }
  .cp-method { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 12px; align-items: center; }
  .cp-bar { height: 8px; border-radius: 999px; background: var(--paper-muted); overflow: hidden; }
  .cp-bar > span { display: block; height: 100%; background: var(--atlas); border-radius: inherit; }

  /* ── Tableaux ── */
  .cp-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--cp-line-soft); vertical-align: top; }
  th { color: var(--cp-muted); font-weight: 500; font-size: 12.5px; white-space: nowrap; border-bottom-color: var(--cp-line); }
  td.n, th.n { text-align: end; }
  tfoot td { font-weight: 600; border-top: 1px solid var(--cp-line); border-bottom: 0; }
  tr.zero td { color: var(--n-400, #A8A49A); }
  .neg { color: var(--danger); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--paper-soft); font-size: 12px; color: var(--n-700, #2E2D29); }
  .tag.ok { background: var(--mint-soft); color: var(--riad); }
  .tag.bad { background: rgba(201, 74, 58, 0.12); color: var(--danger); }
  .cp-note { color: var(--cp-muted); font-size: 13px; margin: 10px 0 0; }

  /* ── Boutons ── */
  .cp-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--cp-line); background: var(--cp-card); cursor: pointer; font-weight: 500; }
  .cp-btn:hover { background: var(--paper-soft); }
  .cp-btn.primary { background: var(--atlas); border-color: var(--atlas); color: var(--paper); }
  .cp-btn.primary:hover { background: var(--atlas-700); }
  .cp-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .cp-exports { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ── États ── */
  .cp-state { text-align: center; padding: 56px 16px; max-width: 520px; margin: 0 auto; }
  .cp-state i, .cp-state svg { width: 38px; height: 38px; color: var(--atlas); margin-bottom: 10px; }
  .cp-state.bad i, .cp-state.bad svg { color: var(--danger); }
  .cp-state h2 { margin: 0 0 6px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .cp-state p { margin: 0 0 18px; color: var(--cp-muted); }
  .cp-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: rgba(201, 74, 58, 0.1); color: #7a2a20; margin-top: 12px; font-size: 14px; }
  .cp-banner .cp-btn { margin-inline-start: auto; min-height: 36px; padding: 0 12px; }
  .cp-loading { padding: 56px 0; text-align: center; color: var(--cp-muted); }
  .cp-foot { color: var(--cp-muted); font-size: 12.5px; margin-top: 28px; text-align: center; }
  [hidden] { display: none !important; }

  @media (max-width: 860px) { .cp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) {
    .cp-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .cp-method { grid-template-columns: 1fr auto; }
    .cp-method .cp-bar { grid-column: 1 / -1; order: 3; }
    .cp-month { width: 100%; }
    .cp-month input { flex: 1; min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print { .cp-top, .cp-exports, .cp-month, .cp-banner { display: none !important; } body { background: #FFFDFA; } }
</style>
</head>
<body>
<div class="cp-wrap">
  <header class="cp-top">
    <div class="cp-brand">
      <img src="assets/kiwi-favicon-new.svg" alt="" width="30" height="30" />
      <div>
        <div class="cp-brand-name">Kiwi</div>
        <div class="cp-brand-sub" id="cp-title" data-t="title"></div>
      </div>
    </div>
    <div class="cp-spacer"></div>
    <div class="cp-lang" id="cp-lang" role="group" aria-label="Langue" data-lens-demo>
      <button type="button" data-lens-item data-lang="fr" lang="fr">FR</button>
      <button type="button" data-lens-item data-lang="en" lang="en">EN</button>
      <button type="button" data-lens-item data-lang="ar" lang="ar">AR</button>
    </div>
  </header>

  <main id="cp-main" aria-busy="true">
    <div class="cp-loading" id="cp-loading"><span data-t="loading"></span></div>
    <section id="cp-state" class="cp-state" hidden></section>

    <div id="cp-ready" hidden>
      <div class="cp-head">
        <div>
          <div class="cp-kicker" data-t="title"></div>
          <h1 id="cp-store"></h1>
        </div>
        <div class="cp-spacer"></div>
        <div class="cp-month">
          <button type="button" class="cp-iconbtn" id="cp-prev" data-t-attr="aria-label:prevMonth"><i data-icon="chevron_left"></i></button>
          <label class="sr" for="cp-month" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" data-t="month"></label>
          <input type="month" id="cp-month" pattern="[0-9]{4}-[0-9]{2}" placeholder="AAAA-MM" />
          <button type="button" class="cp-iconbtn" id="cp-next" data-t-attr="aria-label:nextMonth"><i data-icon="chevron_right"></i></button>
        </div>
      </div>

      <div class="cp-ro" role="note"><i data-icon="lock"></i><div><b data-t="readonly"></b> <span data-t="readonlyNote"></span></div></div>
      <div class="cp-banner" id="cp-banner" hidden role="status"><i data-icon="wifi_off"></i><span id="cp-banner-text"></span><button type="button" class="cp-btn" id="cp-banner-retry"><span data-t="retry"></span></button></div>

      <div id="cp-empty" class="cp-state" hidden>
        <i data-icon="calendar_month"></i>
        <h2 data-t="emptyTitle"></h2>
        <p data-t="emptySub"></p>
      </div>

      <div id="cp-data">
        <div class="cp-grid" id="cp-stats"></div>

        <section class="cp-card" id="cp-sec-methods"></section>
        <section class="cp-card" id="cp-sec-days"></section>
        <section class="cp-card" id="cp-sec-adjust"></section>
        <section class="cp-card" id="cp-sec-invoices"></section>
        <section class="cp-card" id="cp-sec-cash"></section>
        <section class="cp-card" id="cp-sec-detail"></section>

        <section class="cp-card">
          <h2 data-t="exports"></h2>
          <p class="sub" data-t="exportHint"></p>
          <div class="cp-exports">
            <button type="button" class="cp-btn primary" id="cp-ex-journal"><i data-icon="download"></i><span data-t="exJournal"></span></button>
            <button type="button" class="cp-btn" id="cp-ex-invoices"><i data-icon="download"></i><span data-t="exInvoices"></span></button>
            <button type="button" class="cp-btn" id="cp-ex-cash"><i data-icon="download"></i><span data-t="exCash"></span></button>
          </div>
        </section>
      </div>
      <p class="cp-foot" id="cp-foot"></p>
    </div>
  </main>
</div>

<script src="assets/material-icons.js?v=2" defer></script>
<script src="assets/liquid-lens.js?v=7" defer></script>

    exchange().then(function (ex) {
      if (ex && ex.status !== 200) return Promise.reject({ res: ex });
      return load(state.month);
    }).catch(function (err) {
      if (err && err.res) renderState(failKind(err.res));
      else renderState('offline');
    }).finally(function () { state.busy = false; });
  }

  function go(month) {
    if (!/^20\d{2}-(0[1-9]|1[0-2])$/.test(month) || state.busy) { $('cp-month').value = state.month; return; }
    state.busy = true; $('cp-main').setAttribute('aria-busy', 'true');
    load(month).catch(function (err) {
      if (err && err.res && err.res.status !== undefined && err.res.status !== 0) {
        var k = failKind(err.res);
        if (k === 'revoked' || k === 'expired' || k === 'invalid') { renderState(k); return; }
      }
      $('cp-month').value = state.month; banner(true);
      $('cp-banner-text').textContent = err && err.res ? t('unavailableSub') : t('offline');
    }).finally(function () { state.busy = false; $('cp-main').setAttribute('aria-busy', 'false'); });
  }
  function shift(delta) {
    var p = state.month.split('-').map(Number); if (p.length !== 2) return;
    var d = new Date(Date.UTC(p[0], p[1] - 1 + delta, 1));
    go(d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'));
  }

  /* ────────────── Exports CSV ────────────── */
  /* Point-virgule, virgule décimale, BOM UTF-8, fin de ligne CRLF : s'ouvre
   * tel quel dans Excel en français. Un texte qui commencerait par = + - @ est
   * neutralisé (injection de formule) ; les nombres sont écrits par nous. */
  function csvNum(cents) { return cents == null ? '' : (cents < 0 ? '-' : '') + (Math.abs(cents) / 100).toFixed(2).replace('.', ','); }
  function csvText(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  /* Un identifiant de 15 chiffres (ICE) deviendrait 1,23E+14 dans Excel : on le
   * force en texte avec ="…", seulement s'il est strictement alphanumérique. */
  function csvCell(c) {
    if (c && c.x !== undefined) return c.x && /^[0-9A-Za-z]+$/.test(c.x) ? '="' + c.x + '"' : csvText(c.x);
    return c && c.n !== undefined ? (c.n == null ? '' : csvNum(c.n)) : csvText(c);
  }
  function csv(header, rows) {
    return '\ufeff' + [header].concat(rows).map(function (r) { return r.map(csvCell).join(';'); }).join('\r\n') + '\r\n';
  }
  var N = function (cents) { return { n: cents }; };
  var X = function (text) { return { x: text }; };
  function download(name, text) {
    var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  function fileName(part) { return 'kiwi-' + state.data.merchant + '-' + (state.data.range.month || (state.data.range.from + '_' + state.data.range.to)) + '-' + part + '.csv'; }

  function exportJournal() {
    var s = state.data.sales; if (s.status !== 'ok') return;
    var rows = [];
    s.journal.forEach(function (j) {
      var lines = j.parts ? j.parts.map(function (p) { return { method: p.method, cents: p.cents }; }) : [{ method: j.method, cents: j.amountCents }];
      lines.forEach(function (l) {
        rows.push([dayFr(j.day), j.time, j.ref, j.kind === 'refund' ? t('refund') : t('sale'), methodLabel(l.method), N(l.cents), j.channel || '']);
      });
    });
    download(fileName('journal'), csv([t('date'), t('time'), t('ref'), t('kind'), t('method'), t('amount') + ' (MAD)', t('channel')], rows));
  }
  function exportInvoices() {
    var inv = state.data.invoices; if (inv.status !== 'ok') return;
    download(fileName('factures'), csv([t('number'), t('date'), t('customer'), t('ice'), 'IF', t('rate') + ' (%)', t('ht') + ' (MAD)', t('tva') + ' (MAD)', t('ttc') + ' (MAD)'],
      inv.rows.map(function (r) {
        return [r.number, dayFr(r.day), r.customer && r.customer.name || '', X(r.customer && r.customer.ice || ''), X(r.customer && r.customer.if || ''),
          r.tvaRate == null ? '' : String(r.tvaRate).replace('.', ','), N(r.htCents), N(r.tvaCents), N(r.ttcCents)];
      })));
  }
  function exportCash() {
    var cash = state.data.cash, z = state.data.z, rows = [];
    var ymd = function (ts) { return dayFr(new Date(ts).toISOString().slice(0, 10)); };
    if (cash.status === 'ok') cash.sessions.forEach(function (c) {
      rows.push([t('session'), dayFr(c.day), c.terminal, N(c.openingCents), N(c.closedTs ? c.expectedCents : null), N(c.closedTs ? c.countedCents : null), N(c.closedTs ? c.gapCents : null), '', '', '', '', c.closedTs ? '' : t('open')]);
      c.movements.forEach(function (m) {
        rows.push([t('moves'), ymd(m.ts), c.terminal, '', '', '', '', N(m.kind === 'out' ? -m.amountCents : m.amountCents), '', '', '', m.reason]);
      });
    });
    if (z.status === 'ok') z.rows.forEach(function (r) {
      rows.push(['Z', dayFr(r.day), r.terminal, '', '', '', '', '', r.reportedCount + ' / ' + r.serverCount, N(r.reportedCents), N(r.serverCents), r.status === 'matched' ? t('matched') : t('mismatch')]);
    });
    download(fileName('caisse-z'), csv([t('kind'), t('date'), t('register'), t('opening'), t('expected'), t('counted'), t('gap'), t('moves'), t('tickets') + ' (' + t('reported') + ' / ' + t('server') + ')', t('reported') + ' (MAD)', t('server') + ' (MAD)', t('status') + ' / ' + t('reason')], rows));
  }

  /* ────────────── Branchement ────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    Array.prototype.forEach.call(document.querySelectorAll('#cp-lang button'), function (b) {
      b.addEventListener('click', function () {
        lang = b.getAttribute('data-lang');
        try { localStorage.setItem('kiwiComptableLang', lang); } catch (_) {}
        applyLang();
      });
    });
    $('cp-prev').addEventListener('click', function () { shift(-1); });
    $('cp-next').addEventListener('click', function () { shift(1); });
    $('cp-month').addEventListener('change', function (e) { go(e.target.value); });
    $('cp-banner-retry').addEventListener('click', function () { go(state.month); });
    $('cp-ex-journal').addEventListener('click', exportJournal);
    $('cp-ex-invoices').addEventListener('click', exportInvoices);
    $('cp-ex-cash').addEventListener('click', exportCash);
    window.addEventListener('offline', function () { if (state.view === 'ready') banner(true); });
    window.addEventListener('online', function () { if (state.view === 'ready') go(state.month); });
    applyLang();
    boot();
  });
})();
</script>
</body>
</html>
