<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script>
    /* One guest-ordering app (spec §21.1, stage 3c). This page was the QR menu;
       OrderPro.html now is. A table QR printed before (?merchant=<slug>
       &table=N) opens the same store and table there, and the pitch demo (no
       ?merchant) opens OrderPro's demo, Café Atlas. The server answers this URL
       with a 302 first (functions/_middleware.js); this covers a host without it. */
    (function () {
      try {
        var q = new URLSearchParams(location.search), m = (q.get('merchant') || '').trim();
        var t = (q.get('table') || '').replace(/\D/g, '').slice(0, 4);
        location.replace('OrderPro.html?s=' + (m ? encodeURIComponent(m.slice(0, 64)) : 'demo') + (t ? '&t=' + t : ''));
      } catch (_) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Kiwi Order</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5F0; color: #0A0F0D; font: 16px/1.5 system-ui, sans-serif; }
    a { color: #0B6E4F; font-weight: 600; }
  </style>
</head>
<body>
  <p><a href="OrderPro.html?s=demo" id="open-menu">Ouvrir la carte</a></p>
</body>
</html>
