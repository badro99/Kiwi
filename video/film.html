<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kiwi — 3:00</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Kiwi · the film
   1920×1080 · 30fps · 180s

   Rendered frame-by-frame by video/render.mjs, which calls window.seek(t) and
   screenshots. NOTHING here may animate itself: no CSS transitions, no CSS
   animations, no requestAnimationFrame outside preview mode. Every visual is a
   pure function of t. A page that animates on its own tears across frames,
   because capture runs far slower than real time.

   Palette and type are the real system from assets/tokens.css — this is the
   product's own design language, not an approximation of it. Type is roman
   throughout; never italic (see CLAUDE.md §3).
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --atlas: #0B6E4F;
  --riad:  #053B2C;
  --mint:  #7DF2B0;
  --paper: #F7F5F0;
  --ink:   #0A0F0D;
  --n-200: #E8E6E0;
  --n-300: #D4D1C8;
  --n-400: #A8A49A;
  --n-500: #6F6C65;
  --n-600: #4B4944;
  --sans:  'Inter Tight', system-ui, sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;
  --mono:  'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 1920px; height: 1080px;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* Roman, always. An italic heading is the fastest-read "made by a machine"
   tell there is, and the brand forbids it outright. */
em, i, cite, dfn, var { font-style: normal; }

#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

.scene {
  position: absolute; inset: 0;
  opacity: 0;
  will-change: opacity;
}

/* ── type ──────────────────────────────────────────────────────────────── */

.kicker {
  font-family: var(--mono);
  font-size: 15px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--n-400);
}
.display {
  font-size: 104px;
  font-weight: 600;
  line-height: 0.98;
  letter-spacing: -0.042em;
}
.display.sm { font-size: 76px; letter-spacing: -0.036em; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.015em; }
.atlas { color: var(--atlas); }
.muted { color: var(--n-500); }
.lede {
  font-size: 30px; line-height: 1.45; font-weight: 400;
  color: var(--n-600); letter-spacing: -0.012em;
}
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.p { display: inline-block; will-change: transform, opacity; }
.line { display: block; }

/* ── layout ────────────────────────────────────────────────────────────── */

.pad { position: absolute; inset: 0; padding: 120px 150px; }
.center { display: grid; place-content: center; text-align: center; }
.vstack { display: flex; flex-direction: column; }

.rule { height: 1px; background: var(--n-200); width: 100%; }

/* ── product screens ───────────────────────────────────────────────────── */

.screen {
  position: absolute; margin: 0;
  border-radius: 14px;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid rgba(10, 15, 13, 0.09);
  box-shadow: 0 40px 90px -30px rgba(10, 15, 13, 0.30), 0 8px 24px -12px rgba(10, 15, 13, 0.14);
  will-change: transform, opacity;
}
.screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.screen.phone { border-radius: 30px; }

/* ── the trade caption in the montage ──────────────────────────────────── */

/* Positioned with `top` per scene, never `bottom`. Anchoring to the bottom put
   the caption's first line underneath the screenshot above it, where the trade
   name landed on the till's dark sidebar and rendered black on black. */
.caption { position: absolute; left: 150px; }
.caption .trade {
  font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.04;
}
.caption .venue { font-family: var(--serif); font-size: 56px; color: var(--atlas); letter-spacing: -0.015em; line-height: 1.08; }
.caption .note { margin-top: 14px; font-size: 21px; color: var(--n-500); letter-spacing: -0.005em; }

/* counter pip, top right of montage */
.pip {
  position: absolute; right: 150px; top: 906px;
  font-family: var(--mono); font-size: 17px; letter-spacing: 0.18em;
  color: var(--n-400);
}

/* ── cards (the "hard parts" beat) ─────────────────────────────────────── */

.card {
  position: absolute; top: 340px; width: 460px;
  padding-top: 28px;
  border-top: 2px solid var(--atlas);
  will-change: transform, opacity;
}
.card h3 { margin: 0 0 14px; font-size: 40px; font-weight: 600; letter-spacing: -0.028em; }
.card p  { margin: 0; font-size: 21px; line-height: 1.5; color: var(--n-500); }

/* ── wordmark ──────────────────────────────────────────────────────────── */

.mark { font-size: 96px; font-weight: 600; letter-spacing: -0.05em; }
.mark .dot { color: var(--atlas); }

/* ── grain: one static layer, no animation ─────────────────────────────── */

#grain {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.030;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

/* preview-only chrome, never present during a render */
#previewbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 4px;
  background: rgba(10,15,13,0.08); display: none;
}
#previewbar i { display: block; height: 100%; width: 0; background: var(--atlas); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="grain"></div>
<div id="previewbar"><i></i></div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   CONFIG — the only part you need to touch to re-cut the film.
   ═════════════════════════════════════════════════════════════════════════ */

const CONFIG = {
  /* How many trades the film claims. Counted, not assumed: assets/pos-dispatch.js
     registers 14 métiers on PINs 0002–0015, plus the restaurant the demo itself
     runs on = 15. (There is a 15th module, pos-mobile.js, that is not
     PIN-routed, and a "pressing" entry outside the registry — if either counts
     as a trade you sell, raise this to 16 and re-render.) Do not round it up on
     instinct: the demo lock screen prints the PIN range, so anyone watching can
     count them. */
  trades: 15,
  tradesWord: 'Fifteen',

  /* ⚠️  REPLACE THIS WITH YOUR REAL NUMBER BEFORE SENDING TO YC.
     The default below is a true statement about the product, so the film is
     shippable as-is — but a traction beat with an actual number (paying shops,
     MRR, launch date) is worth far more in this slot than a claim about scope.
     Change `line` and `sub`, re-run the render, done. */
  traction: {
    kicker: 'Where we are',
    line: 'Two founders. Fifteen trades.\nOne system, already built.',
    sub: 'Tanger, Maroc',
  },
  founders: 'Badr-Eddin Bakkioui   ·   Zakariae Attahiri',
  closing: 'We want to run the merchant’s whole day —\nand then move the money.',
};

/* The montage. Every note below is a description of what that till actually
   renders — verified against the captures in video/stills, not invented. */
const TRADES = [
  { img: 'pos-boulangerie', trade: 'Bakery',    venue: 'Bab Kasbah',        note: 'Counter service · breads, viennoiserie, priced by unit' },
  { img: 'pos-pharmacie',   trade: 'Pharmacy',  venue: 'Ibn Batouta',       note: 'Prescriptions · the receipt splits patient / insurance' },
  { img: 'pos-boutique',    trade: 'Boutique',  venue: 'Maison Mansour',    note: 'Caftans · sizes, variants, live stock' },
  { img: 'pos-coiffure',    trade: 'Salon',     venue: 'Yasmine',           note: 'Walk-in queue and the appointment book, together' },
  { img: 'pos-gym',         trade: 'Gym',       venue: 'Atlas Fitness',     note: 'Badge check-in · memberships, expiry, peak hours' },
  { img: 'pos-fleuriste',   trade: 'Florist',   venue: 'Fleurs du Détroit', note: 'Compose a bouquet, stem by stem' },
  { img: 'pos-hotel',       trade: 'Riad',      venue: 'Yasmina',           note: 'Reception · rooms, arrivals, folios' },
  { img: 'pos-epicerie',    trade: 'Grocery',   venue: 'Si Brahim',         note: 'Barcode scanning · hundreds of references' },
];

/* Scene table. `at` and `dur` are seconds; they must tile 0→180 exactly. */
const SCENES = [
  { id: 'open',     at: 0,   dur: 11 },
  { id: 'gap',      at: 11,  dur: 13 },
  { id: 'title',    at: 24,  dur: 6  },
  { id: 'montage',  at: 30,  dur: 32 },
  { id: 'grid',     at: 62,  dur: 6  },
  { id: 'system',   at: 68,  dur: 26 },
  { id: 'hard',     at: 94,  dur: 22 },
  { id: 'ai',       at: 116, dur: 22 },
  { id: 'price',    at: 138, dur: 16 },
  { id: 'traction', at: 154, dur: 12 },
  { id: 'close',    at: 166, dur: 14 },
];

const DURATION = SCENES.reduce((m, s) => Math.max(m, s.at + s.dur), 0);

/* ═════════════════════════════════════════════════════════════════════════
   easing — pure functions of a normalised 0..1
   ═════════════════════════════════════════════════════════════════════════ */

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
/** Progress through the window [a,b], clamped. */
const win = (t, a, b) => clamp((t - a) / (b - a || 1e-6));
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

/** Overshoot that matches the brand's liquid-lens curve, cubic-bezier(0.34, 1.45, 0.5, 1). */
function spring(u) {
  u = clamp(u);
  const c = 1.02;
  return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
}

/** Fade in over `inT`, hold, fade out over `outT`, across a scene of length `dur`. */
function envelope(lt, dur, inT = 0.55, outT = 0.45) {
  return Math.min(win(lt, 0, inT), 1 - win(lt, dur - outT, dur));
}

/* ═════════════════════════════════════════════════════════════════════════
   DOM helpers
   ═════════════════════════════════════════════════════════════════════════ */

const stage = document.getElementById('stage');

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/** Wrap each word of `text` in a .p span so it can be staggered. \n starts a new line. */
function words(text) {
  const frag = document.createDocumentFragment();
  text.split('\n').forEach((lineText, li) => {
    const line = el('span', 'line');
    lineText.split(' ').forEach((w, i) => {
      if (i) line.appendChild(document.createTextNode(' '));
      line.appendChild(el('span', 'p', w));
    });
    frag.appendChild(line);
    if (li < text.split('\n').length - 1) frag.appendChild(document.createTextNode(''));
  });
  return frag;
}

/** Rise-and-fade the .p spans inside `root` according to progress u. */
function rise(root, u, dy = 30, stagger = 0.055) {
  const parts = root.__parts || (root.__parts = Array.from(root.querySelectorAll('.p')));
  const n = parts.length;
  const span = Math.max(1e-6, 1 - (n - 1) * stagger);
  for (let i = 0; i < n; i++) {
    const e = easeOut(clamp((u - i * stagger) / span));
    const p = parts[i];
    p.style.opacity = e.toFixed(3);
    p.style.transform = 'translateY(' + ((1 - e) * dy).toFixed(2) + 'px)';
  }
}

function screen(src, cls) {
  const fig = el('figure', 'screen' + (cls ? ' ' + cls : ''));
  const img = el('img');
  img.src = 'stills/' + src + '.png';
  img.alt = '';
  fig.appendChild(img);
  IMAGES.push(img);
  return fig;
}

const IMAGES = [];
const S = {};   // scene id → { root, ...refs }

/* ═════════════════════════════════════════════════════════════════════════
   scene construction
   ═════════════════════════════════════════════════════════════════════════ */

function makeScene(id) {
  const root = el('section', 'scene');
  root.dataset.scene = id;
  stage.appendChild(root);
  S[id] = { root };
  return root;
}

/* ── 1 · cold open ─────────────────────────────────────────────────────── */
{
  const r = makeScene('open');
  const pad = el('div', 'pad center');
  const h = el('h1', 'display');
  h.appendChild(words('Every shop in Morocco'));
  const h2 = el('h1', 'display');
  h2.appendChild(words('closes the same way.'));
  h2.style.marginTop = '6px';
  const sub = el('div', 'kicker');
  sub.style.marginTop = '44px';
  sub.appendChild(words('A NOTEBOOK · A CASH BOX · A CARD TERMINAL'));

  const wrap = el('div', 'vstack');
  wrap.style.alignItems = 'center';
  wrap.appendChild(h); wrap.appendChild(h2); wrap.appendChild(sub);
  pad.appendChild(wrap);
  r.appendChild(pad);
  Object.assign(S.open, { h, h2, sub, wrap });
}

/* ── 2 · the gap ───────────────────────────────────────────────────────── */
{
  const r = makeScene('gap');
  const pad = el('div', 'pad');
  pad.style.display = 'grid';
  pad.style.alignContent = 'center';

  const l1 = el('h2', 'display sm');
  l1.appendChild(words('Square isn’t here.'));
  const l2 = el('h2', 'display sm');
  l2.appendChild(words('Toast isn’t here.'));
  l2.style.marginTop = '2px';

  const rule = el('div', 'rule');
  rule.style.margin = '56px 0';
  rule.style.width = '0px';

  const l3 = el('p', 'lede');
  l3.style.maxWidth = '1020px';
  l3.appendChild(words('The terminal on the counter takes cards. That is all it does.\nThe business itself is still a notebook under the till.'));

  pad.appendChild(l1); pad.appendChild(l2); pad.appendChild(rule); pad.appendChild(l3);
  r.appendChild(pad);
  Object.assign(S.gap, { l1, l2, l3, rule });
}

/* ── 3 · title card ────────────────────────────────────────────────────── */
{
  const r = makeScene('title');
  const pad = el('div', 'pad center');
  const box = el('div', 'vstack');
  box.style.alignItems = 'center';

  const a = el('div', 'display');
  a.appendChild(words('One app.'));
  const b = el('div', 'display serif atlas');
  b.style.marginTop = '4px';
  b.appendChild(words(CONFIG.tradesWord + ' trades.'));

  box.appendChild(a); box.appendChild(b);
  pad.appendChild(box); r.appendChild(pad);
  Object.assign(S.title, { a, b });
}

/* ── 4 · the montage ───────────────────────────────────────────────────── */
{
  const r = makeScene('montage');
  const shots = TRADES.map((tr) => {
    const fig = screen(tr.img);
    // 1120×700 keeps the stills' native 1.6 ratio and leaves the band below
    // 796px entirely free for the caption.
    fig.style.left = '150px';
    fig.style.top = '96px';
    fig.style.width = '1120px';
    fig.style.height = '700px';
    fig.style.opacity = '0';
    r.appendChild(fig);
    return fig;
  });

  const caption = el('div', 'caption');
  caption.style.top = '840px';
  const trade = el('div', 'trade');
  const venue = el('div', 'venue');
  const note = el('div', 'note');
  caption.appendChild(trade); caption.appendChild(venue); caption.appendChild(note);
  r.appendChild(caption);

  const pip = el('div', 'pip');
  r.appendChild(pip);

  Object.assign(S.montage, { shots, caption, trade, venue, note, pip });
}

/* ── 5 · the grid ──────────────────────────────────────────────────────── */
{
  const r = makeScene('grid');
  const cells = TRADES.map((tr, i) => {
    const fig = screen(tr.img);
    const col = i % 4, row = (i / 4) | 0;
    fig.style.width = '404px';
    fig.style.height = '252px';
    fig.style.left = (150 + col * 420) + 'px';
    fig.style.top = (196 + row * 268) + 'px';
    fig.style.borderRadius = '8px';
    r.appendChild(fig);
    return fig;
  });

  const cap = el('div', 'kicker');
  cap.style.position = 'absolute';
  cap.style.left = '150px';
  cap.style.top = '840px';
  cap.appendChild(words('ONE CODEBASE · ONE ACCOUNT · ONE NIGHTLY CLOSE'));
  r.appendChild(cap);
  Object.assign(S.grid, { cells, cap });
}

/* ── 6 · one system, four surfaces ─────────────────────────────────────── */
{
  const r = makeScene('system');

  const head = el('h2', 'display sm');
  head.style.position = 'absolute';
  head.style.left = '150px';
  head.style.top = '110px';
  head.appendChild(words('Four surfaces. One system.'));
  r.appendChild(head);

  /* All four surfaces in one row. An earlier two-row layout put the phones at
   * top:600 while the till still ran to 747 — they overlapped, and the bottom
   * labels sat past the 1080 edge. */
  // A real till, not the PIN lock: the label says "the register", so the frame
  // should show a register actually ringing a sale.
  const till = screen('pos-boulangerie');
  till.style.left = '120px'; till.style.top = '300px';
  till.style.width = '620px'; till.style.height = '388px';
  r.appendChild(till);

  const dash = screen('dashboard');
  dash.style.left = '770px'; dash.style.top = '300px';
  dash.style.width = '620px'; dash.style.height = '388px';
  r.appendChild(dash);

  const srv = screen('serveur', 'phone');
  srv.style.left = '1430px'; srv.style.top = '300px';
  srv.style.width = '200px'; srv.style.height = '434px';
  r.appendChild(srv);

  const ord = screen('order', 'phone');
  ord.style.left = '1660px'; ord.style.top = '300px';
  ord.style.width = '200px'; ord.style.height = '434px';
  r.appendChild(ord);

  const labels = [
    { t: 'The register', x: 120,  y: 712, w: 600 },
    { t: 'The owner’s dashboard', x: 770, y: 712, w: 600 },
    { t: 'The waiter’s phone', x: 1430, y: 758, w: 190 },
    { t: 'The customer’s QR', x: 1660, y: 758, w: 190 },
  ].map((L) => {
    const n = el('div', 'kicker');
    n.style.position = 'absolute';
    n.style.left = L.x + 'px';
    n.style.top = L.y + 'px';
    // Constrain and let it wrap: at full width the two phone labels ran into
    // each other and read as one line of nonsense.
    n.style.width = (L.w || 600) + 'px';
    n.style.lineHeight = '1.5';
    n.textContent = L.t.toUpperCase();
    r.appendChild(n);
    return n;
  });

  const foot = el('p', 'lede');
  foot.style.position = 'absolute';
  foot.style.left = '120px';
  foot.style.top = '840px';
  foot.style.width = '1100px';
  foot.style.fontSize = '27px';
  foot.appendChild(words('A sale rung on the register is on the owner’s dashboard the same second —\nand the kitchen already has the ticket.'));
  r.appendChild(foot);

  Object.assign(S.system, { head, till, dash, srv, ord, labels, foot });
}

/* ── 7 · the hard parts ────────────────────────────────────────────────── */
{
  const r = makeScene('hard');
  const head = el('h2', 'display sm');
  head.style.position = 'absolute';
  head.style.left = '150px';
  head.style.top = '150px';
  head.appendChild(words('The parts nobody wants to build.'));
  r.appendChild(head);

  const specs = [
    { h: 'It works offline.', p: 'Moroccan internet drops. The till keeps ringing sales on the device and reconciles the moment it is back. Nothing is lost, nothing is double-counted.' },
    { h: 'It talks to the hardware.', p: 'We wrote the bridge ourselves: thermal receipts, kitchen tickets, barcode labels, the cash drawer kick. ESC/POS, over the shop’s own network.' },
    { h: 'It works in Arabic.', p: 'French, English and Arabic, with real right-to-left layout across every surface — not a translation bolted onto a left-to-right screen.' },
  ];
  const cards = specs.map((s, i) => {
    const c = el('div', 'card');
    c.style.left = (150 + i * 545) + 'px';
    c.appendChild(el('h3', null, s.h));
    const p = el('p');
    p.appendChild(words(s.p));
    c.appendChild(p);
    r.appendChild(c);
    return c;
  });
  Object.assign(S.hard, { head, cards });
}

/* ── 8 · the assistant ─────────────────────────────────────────────────── */
{
  const r = makeScene('ai');
  const shot = screen('ai');
  shot.style.left = '110px'; shot.style.top = '150px';
  shot.style.width = '1060px'; shot.style.height = '663px';
  r.appendChild(shot);

  /* 58px, not the 76px of .display.sm: at 76 the heading wrapped to three
   * lines in this column and the third line landed on top of the body copy. */
  const head = el('h2', 'display sm');
  head.style.position = 'absolute';
  head.style.left = '1250px';
  head.style.top = '300px';
  head.style.width = '540px';
  head.style.fontSize = '58px';
  head.appendChild(words('Ask the business a question.'));
  r.appendChild(head);

  const body = el('p', 'lede');
  body.style.position = 'absolute';
  body.style.left = '1250px';
  body.style.top = '560px';
  body.style.width = '540px';
  body.style.fontSize = '22px';
  body.appendChild(words('It answers from the merchant’s own numbers, shows which figures it used, and refuses when it does not actually know.'));
  r.appendChild(body);

  const cap = el('div', 'caption');
  cap.style.top = '900px';
  const capNote = el('div', 'note');
  capNote.style.marginTop = '0';
  capNote.appendChild(words('Runs locally. The data never leaves the device.'));
  cap.appendChild(capNote);
  r.appendChild(cap);

  Object.assign(S.ai, { shot, head, body, cap });
}

/* ── 9 · price ─────────────────────────────────────────────────────────── */
{
  const r = makeScene('price');
  const pad = el('div', 'pad center');
  const box = el('div', 'vstack');
  box.style.alignItems = 'center';

  const k = el('div', 'kicker');
  k.appendChild(words('KIWI BASIC'));

  const big = el('div', 'display num');
  big.style.marginTop = '26px';
  big.style.fontSize = '150px';
  big.appendChild(words('199 MAD'));

  const per = el('div', 'lede');
  per.style.marginTop = '10px';
  per.appendChild(words('per month  ·  about twenty dollars'));

  const rule = el('div', 'rule');
  rule.style.margin = '52px auto';
  rule.style.width = '0px';

  const foot = el('div', 'lede');
  foot.style.fontSize = '26px';
  foot.appendChild(words('On the hardware they already own. Unlimited devices.\nNo commitment. Support over WhatsApp, in Darija.'));

  box.appendChild(k); box.appendChild(big); box.appendChild(per);
  box.appendChild(rule); box.appendChild(foot);
  pad.appendChild(box); r.appendChild(pad);
  Object.assign(S.price, { k, big, per, rule, foot });
}

/* ── 10 · traction ─────────────────────────────────────────────────────── */
{
  const r = makeScene('traction');

/* ═════════════════════════════════════════════════════════════════════════
   per-scene drawing — each takes local time and returns nothing
   ═════════════════════════════════════════════════════════════════════════ */

const DRAW = {
  open(lt, dur) {
    const s = S.open;
    rise(s.h,  win(lt, 0.5, 2.4));
    rise(s.h2, win(lt, 1.1, 3.1));
    rise(s.sub, win(lt, 3.0, 4.6), 16, 0.02);
    // a slow, almost imperceptible push in — 1.0 → 1.022 over the whole scene
    const k = 1 + 0.022 * easeInOut(win(lt, 0, dur));
    s.wrap.style.transform = 'scale(' + k.toFixed(4) + ')';
  },

  gap(lt) {
    const s = S.gap;
    rise(s.l1, win(lt, 0.3, 2.0));
    rise(s.l2, win(lt, 0.9, 2.6));
    s.rule.style.width = (1620 * easeInOut(win(lt, 2.2, 4.0))).toFixed(1) + 'px';
    rise(s.l3, win(lt, 3.4, 6.4), 22, 0.012);
  },

  title(lt) {
    const s = S.title;
    rise(s.a, win(lt, 0.2, 1.5));
    rise(s.b, win(lt, 0.7, 2.2));
  },

  montage(lt, dur) {
    const s = S.montage;
    const n = TRADES.length;
    const slot = dur / n;                 // 4s per trade
    const i = Math.min(n - 1, Math.floor(lt / slot));
    const u = (lt - i * slot) / slot;     // 0..1 within this trade

    /* Each shot only ever fades IN, and later shots sit above earlier ones in
     * DOM order, so the incoming screen covers the outgoing one. Never fade the
     * outgoing shot out: hiding it while the incoming is still at zero opacity
     * puts a blank paper frame at every cut — eight visible flashes across the
     * montage. Stacking costs nothing and the seam is clean. */
    const FADE = 0.55;
    for (let j = 0; j < n; j++) {
      const fig = s.shots[j];
      const start = j * slot;
      if (lt < start) { fig.style.opacity = '0'; continue; }
      fig.style.opacity = easeInOut(win(lt, start, start + FADE)).toFixed(3);
      // Drift a touch upward through each slot so a held screenshot never
      // reads as a frozen frame.
      const su = clamp((lt - start) / slot);
      fig.style.transform = 'translateY(' + (-10 * su).toFixed(2) + 'px) scale(' + (1 + 0.012 * su).toFixed(4) + ')';
    }

    const tr = TRADES[i];
    if (s.__i !== i) {
      s.trade.textContent = tr.trade;
      s.venue.textContent = tr.venue;
      s.note.textContent = tr.note;
      s.pip.textContent = String(i + 1).padStart(2, '0') + ' / ' + CONFIG.trades;
      s.__i = i;
    }
    const ca = Math.min(win(u, 0.06, 0.30), 1 - win(u, 0.88, 1));
    s.caption.style.opacity = ca.toFixed(3);
    s.caption.style.transform = 'translateY(' + ((1 - easeOut(win(u, 0.06, 0.36))) * 22).toFixed(2) + 'px)';
    s.pip.style.opacity = ca.toFixed(3);
  },

  grid(lt, dur) {
    const s = S.grid;
    s.cells.forEach((c, i) => {
      const e = spring(win(lt, 0.06 * i, 0.06 * i + 0.9));
      c.style.opacity = clamp(e).toFixed(3);
      c.style.transform = 'scale(' + (0.90 + 0.10 * e).toFixed(4) + ')';
    });
    rise(s.cap, win(lt, 1.5, 3.0), 14, 0.012);
  },

  system(lt) {
    const s = S.system;
    rise(s.head, win(lt, 0.2, 2.0));

    const pop = (node, a) => {
      const e = spring(win(lt, a, a + 1.0));
      node.style.opacity = clamp(e).toFixed(3);
      node.style.transform = 'translateY(' + ((1 - clamp(e)) * 26).toFixed(2) + 'px)';
    };
    pop(s.till, 1.2);
    pop(s.dash, 1.9);
    pop(s.srv, 2.6);
    pop(s.ord, 3.1);

    s.labels.forEach((n, i) => {
      const e = easeOut(win(lt, 3.8 + i * 0.22, 4.8 + i * 0.22));
      n.style.opacity = e.toFixed(3);
    });
    rise(s.foot, win(lt, 6.0, 8.4), 18, 0.02);
  },

  hard(lt) {
    const s = S.hard;
    rise(s.head, win(lt, 0.2, 2.2));
    s.cards.forEach((c, i) => {
      const a = 2.0 + i * 1.15;
      const e = easeOut(win(lt, a, a + 1.3));
      c.style.opacity = e.toFixed(3);
      c.style.transform = 'translateY(' + ((1 - e) * 34).toFixed(2) + 'px)';
    });
  },

  ai(lt, dur) {
    const s = S.ai;
    const e = spring(win(lt, 0.2, 1.4));
    s.shot.style.opacity = clamp(e).toFixed(3);
    // Push in slowly on the answer, anchored top-left so the big figure grows
    // toward the centre of frame rather than drifting off it.
    // Keep the push modest: at 1.05 the screen's right edge grew into the text
    // column. 1.03 from a left-biased origin stays clear of it.
    const k = 1 + 0.03 * easeInOut(win(lt, 1.0, dur));
    s.shot.style.transformOrigin = '14% 24%';
    s.shot.style.transform = 'scale(' + (0.965 + 0.035 * clamp(e)).toFixed(4) + ') scale(' + k.toFixed(4) + ')';
    rise(s.head, win(lt, 2.0, 4.0));
    rise(s.body, win(lt, 3.4, 6.4), 18, 0.012);
    rise(s.cap, win(lt, 7.0, 9.0), 14, 0.014);
  },

  price(lt) {
    const s = S.price;
    rise(s.k, win(lt, 0.2, 1.2), 14, 0.02);
    const e = spring(win(lt, 0.6, 2.0));
    s.big.style.opacity = clamp(e).toFixed(3);
    s.big.style.transform = 'scale(' + (0.94 + 0.06 * clamp(e)).toFixed(4) + ')';
    rise(s.per, win(lt, 1.6, 3.0), 16, 0.02);
    s.rule.style.width = (760 * easeInOut(win(lt, 2.6, 4.2))).toFixed(1) + 'px';
    rise(s.foot, win(lt, 3.6, 6.2), 18, 0.016);
  },

  traction(lt) {
    const s = S.traction;
    rise(s.k, win(lt, 0.2, 1.2), 14, 0.02);
    rise(s.line, win(lt, 0.8, 3.2), 26, 0.04);
    rise(s.sub, win(lt, 2.6, 4.2), 16, 0.02);
  },

  close(lt, dur) {
    const s = S.close;
    rise(s.quote, win(lt, 0.4, 3.4), 26, 0.035);
    s.rule.style.width = (620 * easeInOut(win(lt, 3.2, 4.8))).toFixed(1) + 'px';
    const e = spring(win(lt, 4.2, 5.6));
    s.mark.style.opacity = clamp(e).toFixed(3);
    s.mark.style.transform = 'scale(' + (0.92 + 0.08 * clamp(e)).toFixed(4) + ')';
    s.who.style.opacity = easeOut(win(lt, 5.6, 7.0)).toFixed(3);
  },
};

/* ═════════════════════════════════════════════════════════════════════════
   seek — the single entry point the renderer drives
   ═════════════════════════════════════════════════════════════════════════ */

window.seek = function seek(t) {
  t = clamp(t, 0, DURATION);

  for (const sc of SCENES) {
    const s = S[sc.id];
    const lt = t - sc.at;
    const active = lt >= -0.001 && lt < sc.dur;

    if (!active) {
      if (s.root.style.opacity !== '0') s.root.style.opacity = '0';
      continue;
    }

    // Scene-level fade. The first and last scenes ease from and to the paper;
    // the interior cuts are quick dissolves so the film keeps its pace.
    const isFirst = sc.at === 0;
    const isLast = sc.at + sc.dur >= DURATION;
    const fadeIn = isFirst ? 1.1 : 0.42;
    const fadeOut = isLast ? 1.6 : 0.42;
    s.root.style.opacity = envelope(lt, sc.dur, fadeIn, fadeOut).toFixed(3);

    DRAW[sc.id](lt, sc.dur);
  }
};

/* ═════════════════════════════════════════════════════════════════════════
   readiness — the renderer waits on this
   ═════════════════════════════════════════════════════════════════════════ */

window.__filmDuration = DURATION;
window.seek(0);

/* Readiness must never hang. A loaded-but-undecoded image can paint blank on
   the first frame that shows it, so decode() is worth attempting — but in a
   backgrounded tab decode() never settles at all (measured: it does not resolve
   or reject, ever). So gate on load, and treat decode as best-effort with a
   ceiling. Otherwise the renderer sits at "film never signalled __filmReady"
   forever on a machine where the window happens to be hidden. */
function imageReady(img) {
  const settled = (img.complete && img.naturalWidth > 0)
    ? Promise.resolve()
    : new Promise((res) => {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
        setTimeout(res, 8000);
      });

  return settled.then(() => Promise.race([
    img.decode ? img.decode().catch(() => {}) : Promise.resolve(),
    new Promise((res) => setTimeout(res, 1500)),
  ]));
}

Promise.all([document.fonts.ready, ...IMAGES.map(imageReady)]).then(() => {
  window.seek(0);
  window.__filmReady = true;
});

/* ── preview mode: ?play plays it in real time in a normal browser ──────
   Never active during a render — render.mjs loads the bare URL. */
if (location.search.includes('play')) {
  const bar = document.getElementById('previewbar');
  bar.style.display = 'block';
  const fill = bar.querySelector('i');
  const t0 = performance.now();
  const tick = () => {
    const t = ((performance.now() - t0) / 1000) % DURATION;
    window.seek(t);
    fill.style.width = ((t / DURATION) * 100).toFixed(2) + '%';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
