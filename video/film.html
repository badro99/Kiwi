<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Kiwi — film</title>
<link rel="stylesheet" href="vendor/fonts.css" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Kiwi film v2 — 1920×1080 · 30fps · 180.000s

   EVERY VISUAL IS A PURE FUNCTION OF t. There is not one CSS animation,
   transition, @keyframes, requestAnimationFrame or Date.now() in this file.
   Capture runs ~7fps against a 30fps timeline, so anything that animates
   itself tears across frames. Randomness comes from a seeded generator
   evaluated once at build time, never per frame.

   Stage is riad → black; --paper appears only inside product screens, so the
   real UI captures are the only bright thing on screen and they glow.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --atlas:#0B6E4F; --riad:#053B2C; --mint:#7DF2B0; --paper:#F7F5F0; --ink:#0A0F0D;
  --sans:'Inter Tight',system-ui,sans-serif;
  --serif:'Instrument Serif',serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Type is roman. Never italic — the brand forbids it and it is the fastest
   "generated by a machine" tell there is. */
em,i,cite,dfn,var{font-style:normal}

html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:var(--sans);color:var(--paper);-webkit-font-smoothing:antialiased}

#gl{position:absolute;inset:0;width:1920px;height:1080px;z-index:0}

/* The stage gradient: riad at the horizon falling to black at the edges. */
#bg{position:absolute;inset:0;z-index:1;
    background:
      radial-gradient(120% 85% at 50% 62%, #0a5c42 0%, #053B2C 34%, #021b14 68%, #000 100%);}

#stage{position:absolute;inset:0;z-index:2;perspective:1600px;perspective-origin:50% 50%;}
.scene{position:absolute;inset:0;transform-style:preserve-3d;display:none}
.grp{position:absolute;inset:0;transform-style:preserve-3d}

/* ── product screens as physical objects ─────────────────────────────── */
.screen{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
        border-radius:14px;overflow:hidden;
        background-size:cover;background-position:center top;
        box-shadow:0 60px 120px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(125,242,176,.10);}
/* Specular sheen — a raking highlight so a tilted plane catches light. */
.screen::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%,
             rgba(255,255,255,0) 62%,rgba(125,242,176,.09) 100%);}
/* Contact shadow, separate so it can blur and spread independently. */
.shadow{position:absolute;left:50%;top:50%;border-radius:50%;
        background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.8),rgba(0,0,0,0) 70%);
        filter:blur(24px)}

/* ── type ────────────────────────────────────────────────────────────── */
#type{position:absolute;inset:0;z-index:3;pointer-events:none}
.tblock{position:absolute;opacity:0}
/* The mask needs vertical slack or it shears accents (É) and descenders (p, j)
   off 104px type; the negative margin gives the slack back to the layout. */
.line{overflow:hidden;display:block;padding-bottom:.16em;margin-bottom:-.16em}
.line > span{display:block}
.h1{font-size:104px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
.h2{font-size:68px;font-weight:600;letter-spacing:-.028em;line-height:1.06}
.ser{font-family:var(--serif);font-weight:400}
.eyebrow{font-family:var(--mono);font-size:19px;letter-spacing:.30em;text-transform:uppercase;
         color:var(--mint);opacity:.9}
.lede{font-size:31px;font-weight:400;line-height:1.45;color:rgba(247,245,240,.74);max-width:900px}
.tnum{font-variant-numeric:tabular-nums}

/* wordmark */
.wm{display:inline-flex;align-items:baseline;gap:.05em;font-weight:600;letter-spacing:-.055em;
    color:var(--paper);line-height:1}
.wm .dot{width:.19em;height:.19em;border-radius:50%;background:var(--mint);display:inline-block}

/* ── cold-open receipt ───────────────────────────────────────────────── */
#receipt{position:absolute;left:50%;top:50%;width:420px;
  background:linear-gradient(180deg,#fbf9f4,#e8e4da);color:#141815;
  font-family:var(--mono);font-size:17px;line-height:1.85;padding:34px 30px 60px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.9);}
#receipt .r-h{font-size:21px;font-weight:500;letter-spacing:.08em;text-align:center;margin-bottom:6px}
#receipt .r-s{text-align:center;font-size:13px;opacity:.6;letter-spacing:.18em;margin-bottom:20px}
#receipt .r-r{display:flex;justify-content:space-between}
#receipt .r-t{display:flex;justify-content:space-between;font-size:22px;font-weight:500;
  border-top:1.5px dashed rgba(0,0,0,.35);margin-top:14px;padding-top:12px}
#receipt .r-tear{position:absolute;left:0;right:0;bottom:-1px;height:14px;
  background:repeating-linear-gradient(135deg,#e8e4da 0 8px,transparent 8px 16px)}
/* the printer slot the receipt emerges from */
#slot{position:absolute;left:50%;top:50%;width:520px;height:34px;border-radius:6px;
  background:linear-gradient(180deg,#05130e,#000);box-shadow:0 0 60px 20px rgba(0,0,0,.9)}

/* ── the lone terminal (scene 2) ─────────────────────────────────────── */
/* Deliberately an unimpressive object — but it has to be LEGIBLE to read as
   unimpressive. At 150px of near-black on the riad stage it measured as an
   empty frame: the subject of the scene was invisible for most of its 14s.
   Bigger, with a lit body and a rim that separates it from the background. */
.term{position:absolute;left:50%;top:50%;width:214px;height:328px;border-radius:24px;
  background:linear-gradient(160deg,#1e5744,#07231a);
  box-shadow:0 46px 92px -22px rgba(0,0,0,.9),0 0 0 1px rgba(125,242,176,.26),
             0 0 120px -20px rgba(125,242,176,.12);
  transform-style:preserve-3d}
.term .t-scr{position:absolute;left:20px;right:20px;top:23px;height:111px;border-radius:9px;
  background:#03130d;box-shadow:inset 0 0 30px rgba(125,242,176,.22)}
.term .t-key{position:absolute;border-radius:5px;background:rgba(247,245,240,.20)}

/* ── light trail (scene 5) ───────────────────────────────────────────── */
.spark{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 26px 9px rgba(125,242,176,.62),0 0 70px 26px rgba(125,242,176,.24)}
.trail{position:absolute;height:2px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(125,242,176,0),rgba(125,242,176,.85))}

/* ── price numerals (scene 8) ────────────────────────────────────────── */
.mega{position:absolute;left:50%;top:50%;font-size:520px;font-weight:700;letter-spacing:-.055em;
  line-height:.8;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── close fragments (scene 9) ───────────────────────────────────────── */
.frag{position:absolute;left:50%;top:50%;border-radius:4px;background:var(--mint);opacity:.85}

/* ── grade: vignette + fixed grain ───────────────────────────────────── */
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
/* Static SVG turbulence. A texture, not an animation — identical every frame. */
#grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.055;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>

<canvas id="gl" width="1920" height="1080"></canvas>
<div id="bg"></div>

<div id="stage">
  <div class="scene" id="s1">
    <div class="grp" id="s1cam">
      <div id="slot"></div>
      <div id="receipt">
        <div class="r-h">CAFÉ ATLAS</div>
        <div class="r-s">MAARIF · CASABLANCA</div>
        <div class="r-r"><span>2 × Café noir</span><span>24,00</span></div>
        <div class="r-r"><span>1 × Msemen</span><span>12,00</span></div>
        <div class="r-r"><span>1 × Jus d'orange</span><span>18,00</span></div>
        <div class="r-r"><span>2 × Thé menthe</span><span>28,00</span></div>
        <div class="r-r"><span>1 × Batbout</span><span>21,00</span></div>
        <div class="r-t"><span>TOTAL</span><span>103,00 MAD</span></div>
        <div class="r-tear"></div>
      </div>
    </div>
  </div>

  <div class="scene" id="s2">
    <div class="grp" id="s2cam">
      <div class="term" id="term"><div class="t-scr"></div></div>
    </div>
  </div>

  <div class="scene" id="s3"><div class="grp" id="s3cam"></div></div>
  <div class="scene" id="s4"><div class="grp" id="s4cam"></div></div>
  <div class="scene" id="s5"><div class="grp" id="s5cam"></div></div>
  <div class="scene" id="s6"><div class="grp" id="s6cam"></div></div>
  <div class="scene" id="s7"><div class="grp" id="s7cam"></div></div>
  <div class="scene" id="s8"><div class="grp" id="s8cam"></div></div>
  <div class="scene" id="s9"><div class="grp" id="s9cam"></div></div>
</div>

<div id="type"></div>
<div id="vig"></div>
<div id="grain"></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>
<script>
/* ═════════════════════════════════════════════════════════════════════════
   BUILD
   ═════════════════════════════════════════════════════════════════════════ */
gsap.ticker.lagSmoothing(0);

const DUR = 180;
const EASE = 'power3.out';
const EASE_IO = 'power2.inOut';

/* Seeded PRNG — every "random" value is drawn once, here, at build time, so
   the same t always yields the same frame. Math.random() is never called. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(0x4B495749); // "KIWI"

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,parent)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(parent)parent.appendChild(n);return n;};

/* ── content ────────────────────────────────────────────────────────────
   Trades: assets/pos-dispatch.js registers 14 métiers on PINs 0002–0015,
   plus the restaurant the demo itself runs on = 15. Eight have real
   captures; the grid states the true count and shows the PIN range, so the
   number is verifiable on camera rather than merely asserted. */
const TRADES = [
  { img:'pos-boulangerie.png', name:'Boulangerie',    note:'Vente au poids · fournées' },
  { img:'pos-pharmacie.png',   name:'Pharmacie',      note:'Ordonnances · lots' },
  { img:'pos-boutique.png',    name:'Boutique',       note:'Tailles · couleurs · stock' },
  { img:'pos-coiffure.png',    name:'Coiffure',       note:'Rendez-vous · prestations' },
  { img:'pos-gym.png',         name:'Salle de sport', note:'Abonnements · accès' },
  { img:'pos-fleuriste.png',   name:'Fleuriste',      note:'Compositions · livraison' },
  { img:'pos-hotel.png',       name:'Riad',           note:'Chambres · séjours' },
  { img:'pos-epicerie.png',    name:'Épicerie',       note:'Code-barres · balance' },
];
/* accelerating cut lengths — 7.5→4s, summing to exactly 46s */
const TRADE_DUR = [7.5, 7, 6.5, 6, 5.5, 5, 4.5, 4];

const IMAGES = new Set([...TRADES.map(t=>t.img),
  'dashboard.png','ai.png','serveur.png','order.png','caisse-lock.png']);

/* ── scene table — exactly one scene is visible at any t ───────────────── */
const SCENES = [
  { id:'s1', in:0,   out:12  },
  { id:'s2', in:12,  out:26  },
  { id:'s3', in:26,  out:72  },
  { id:'s4', in:72,  out:80  },
  { id:'s5', in:80,  out:106 },
  { id:'s6', in:106, out:128 },
  { id:'s7', in:128, out:150 },
  { id:'s8', in:150, out:166 },
  { id:'s9', in:166, out:180 },
];
SCENES.forEach(s => { s.el = document.getElementById(s.id); });

/* ── helpers ───────────────────────────────────────────────────────────── */
function screen(parent, img, w, h){
  const s = el('div','screen',parent);
  s.style.width = w+'px'; s.style.height = h+'px';
  s.style.marginLeft = (-w/2)+'px'; s.style.marginTop = (-h/2)+'px';
  s.style.backgroundImage = "url('stills/"+img+"')";
  return s;
}
function shadowFor(parent, w){
  const sh = el('div','shadow',parent);
  sh.style.width = (w*1.05)+'px'; sh.style.height = (w*0.20)+'px';
  sh.style.marginLeft = (-w*0.525)+'px';
  return sh;
}
function typeBlock(html, css){
  const b = el('div','tblock', $('#type'));
  Object.assign(b.style, css);
  b.innerHTML = html;
  return b;
}
const linesOf = b => [...b.querySelectorAll('.line > span')];

/* Reveal a type block: mask-wipe each line up, staggered. */
function revealType(tl, block, at, stagger){
  stagger = stagger === undefined ? 0.075 : stagger;
  tl.set(block, { opacity:1 }, at);
  tl.fromTo(linesOf(block),
    { yPercent:112 }, { yPercent:0, duration:1.15, ease:EASE, stagger }, at);
}
function hideType(tl, block, at){
  tl.to(block, { opacity:0, duration:0.45, ease:'power2.in' }, at);
}
/* Per-character split, for the few moments that earn it. */
function chars(node){
  const txt = node.textContent; node.textContent = '';
  return [...txt].map(c => {
    const s = el('span', null, node);
    s.textContent = c;
    s.style.display = 'inline-block';
    return s;
  });
}

/* ═════════════════════════════════════════════════════════════════════════
   THREE — volumetric dust behind everything, so no frame is ever still.
   Position is a closed-form function of t; there is no animation loop.
   ═════════════════════════════════════════════════════════════════════════ */
let renderer=null, scene3=null, cam3=null, dust=null, dustBase=null;
try{
  renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias:true, alpha:true });
  renderer.setPixelRatio(1);
  renderer.setSize(1920,1080,false);
  scene3 = new THREE.Scene();
  cam3 = new THREE.PerspectiveCamera(42, 1920/1080, 0.1, 400);
  cam3.position.set(0,0,54);

  const N = 900, pos = new Float32Array(N*3);
  dustBase = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const x=(rnd()*2-1)*90, y=(rnd()*2-1)*52, z=-rnd()*150;
    dustBase[i*3]=x; dustBase[i*3+1]=y; dustBase[i*3+2]=z;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  dust = new THREE.Points(g, new THREE.PointsMaterial({
    color:0x7DF2B0, size:0.42, transparent:true, opacity:0.30,
    sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene3.add(dust);
}catch(e){ renderer = null; }

function renderGL(t){
  if(!renderer) return;
  const p = dust.geometry.attributes.position.array, b = dustBase;
  for(let i=0;i<p.length;i+=3){
    p[i]   = b[i]   + Math.sin(t*0.11  + b[i+2]*0.05) * 3.2;
    p[i+1] = b[i+1] + Math.cos(t*0.085 + b[i]  *0.04) * 2.1;
  }
  dust.geometry.attributes.position.needsUpdate = true;
  dust.rotation.z = t * 0.004;
  cam3.position.z = 54 - t * 0.045;
  renderer.render(scene3, cam3);
}

/* ═════════════════════════════════════════════════════════════════════════
   TIMELINE
   ═════════════════════════════════════════════════════════════════════════ */
const tl = gsap.timeline({ paused:true });

/* ── 1 · COLD OPEN (0–12) ────────────────────────────────────────────── */
{
  const cam = $('#s1cam'), r = $('#receipt'), slot = $('#slot');
  gsap.set(r, { xPercent:-50, yPercent:-50 });
  gsap.set(slot, { xPercent:-50, yPercent:-50, y:-330 });

  /* Camera scale multiplies the receipt's own y offset, so these two tweens
     have to be solved together: at 7.2× a -430 offset threw the paper clean
     off the top of frame and the film opened on an empty stage. 3.8× with a
     -60 start puts us inside the paper on frame zero. */
  tl.fromTo(cam,
    { scale:3.8, y:0, rotateX:16, rotateZ:-3, filter:'blur(9px)' },
    { scale:0.86, y:-10, rotateX:5, rotateZ:0, filter:'blur(0px)',
      duration:9.4, ease:'power3.out' }, 0);
  /* the receipt keeps feeding out the whole time — the shot never rests */
  tl.fromTo(r, { y:-60 }, { y:150, duration:12, ease:'none' }, 0);
  tl.fromTo(slot, { opacity:0 }, { opacity:1, duration:1.6, ease:EASE_IO }, 5.2);
  tl.to(cam, { scale:0.80, y:-34, duration:2.6, ease:EASE_IO }, 9.4);

  const wm = typeBlock(
    '<div class="wm" style="font-size:132px">kiwi<span class="dot"></span></div>',
    { left:'50%', top:'50%', transform:'translate(-50%,-50%)', textAlign:'center' });
  tl.fromTo(wm, { opacity:0, scale:1.14, filter:'blur(14px)' },
                { opacity:1, scale:1, filter:'blur(0px)', duration:2.2, ease:EASE }, 9.0);
  /* lands on 12.0 exactly. Ending at 12.2 wasted the tail: setScene() hides
     s1 at t=12, so the last 0.2s of this fade was never on camera and the
     film sat on empty green until scene 2 ramped up. */
  tl.to(wm, { opacity:0, scale:0.97, duration:0.9, ease:'power2.in' }, 11.1);
  tl.to(r,    { opacity:0, duration:1.0, ease:'power2.in' }, 9.4);
  tl.to(slot, { opacity:0, duration:1.0, ease:'power2.in' }, 9.4);
}

/* ── 2 · THE GAP (12–26) ─────────────────────────────────────────────── */
{
  const cam = $('#s2cam'), term = $('#term');
  gsap.set(term, { xPercent:-50, yPercent:-50 });
  for(let i=0;i<12;i++){
    /* keypad geometry is in the .term's own 214×328 box — scaled with it */
    const k = el('div','t-key',term);
    k.style.width='48px'; k.style.height='31px';
    k.style.left = (23 + (i%3)*57)+'px';
    k.style.top  = (157 + Math.floor(i/3)*38.5)+'px';
  }
  tl.fromTo(cam, { scale:1.5, rotateY:-16, x:120, filter:'blur(4px)' },
                 { scale:0.92, rotateY:12, x:-90, filter:'blur(0px)',
                   duration:14, ease:'none' }, 12);
  /* Opacity and the 3D move are split on purpose. Ramping them together over
     3.4s meant the terminal was under 40% for the first second and a half of
     its own scene — measured as dead air. The move still takes 3.4s; the
     subject is simply present for all of it. */
  tl.fromTo(term, { z:-260, rotateY:24 },
                  { z:0, rotateY:-10, duration:3.4, ease:EASE }, 12);
  tl.fromTo(term, { opacity:0 }, { opacity:1, duration:1.0, ease:EASE }, 12);

  const t1 = typeBlock(
    '<div class="eyebrow line"><span>Le terminal</span></div>' +
    '<div class="h1 line" style="margin-top:22px"><span>Un terminal encaisse.</span></div>' +
    '<div class="h1 ser line"><span>Il ne raconte rien.</span></div>',
    { left:'170px', top:'380px' });
  revealType(tl, t1, 13.4);

  const t2 = typeBlock(
    '<div class="lede line"><span>Ni ce qui s\'est vendu, ni ce qui manque en stock,</span></div>' +
    '<div class="lede line"><span>ni qui était en salle, ni ce que ça a coûté.</span></div>',
    { left:'170px', top:'700px' });
  revealType(tl, t2, 18.6, 0.09);
  hideType(tl, t1, 24.9); hideType(tl, t2, 24.9);
  /* holds to 26.0 — the cut into the montage, not a second before it */
  tl.to(term, { opacity:0, z:-160, duration:1.0, ease:'power2.in' }, 25.0);
}

/* ── 3 · TRADE MONTAGE (26–72) — the hero section ────────────────────── */
{
  const cam = $('#s3cam');
  tl.fromTo(cam, { rotateY:9, rotateX:-3, scale:1.02 },
                 { rotateY:-9, rotateX:3, scale:1.06, duration:46, ease:'none' }, 26);

  let at = 26;
  TRADES.forEach((tr, i) => {
    const d = TRADE_DUR[i];
    /* 3200×2000 → 1.6:1. Sized and lifted so the plane's bottom edge clears
       the label block: 700 tall, centred 90 up, so it ends at y=800 and the
       label starts at 838. At 1180×738 centred the two collided. */
    const W = 1120, H = 700, LIFT = -90;
    const sh = shadowFor(cam, W);
    const s  = screen(cam, tr.img, W, H);
    const sgn = (i % 2 === 0) ? -1 : 1;

    gsap.set(s,  { opacity:0, y:LIFT });
    gsap.set(sh, { opacity:0, y:LIFT + H*0.52 });

    /* Each card starts arriving half a second before the previous one has
       finished leaving. Butt-jointing them (in at `at`, out ending at `at`)
       left 0.4s of empty stage at every one of the seven cuts — dead air that
       the accelerating rhythm makes worse, not better, as the clips shorten. */
    const inAt = i === 0 ? at : at - 0.5;
    tl.fromTo(s,
      { x:sgn*1500, z:-900, rotateY:sgn*-46, rotateZ:sgn*5, opacity:0, filter:'blur(12px)' },
      { x:0, z:0, rotateY:0, rotateZ:0, opacity:1, filter:'blur(0px)',
        duration:1.25, ease:EASE }, inAt);
    tl.to(sh, { opacity:0.85, duration:1.25, ease:EASE }, inAt);
    /* hold — but the plane keeps breathing and drifting */
    tl.to(s, { z:70, rotateY:sgn*3.2, rotateX:-1.4, duration:d-2.05, ease:'none' }, at+1.25);
    tl.to(s, { x:-sgn*1700, z:-700, rotateY:-sgn*40, opacity:0, filter:'blur(14px)',
               duration:0.8, ease:'power2.in' }, at+d-0.8);
    tl.to(sh, { opacity:0, duration:0.8, ease:'power2.in' }, at+d-0.8);

    const lab = typeBlock(
      '<div class="eyebrow line"><span>' + String(i+1).padStart(2,'0') + ' / 15</span></div>' +
      '<div class="h2 line" style="margin-top:14px"><span>' + tr.name + '</span></div>' +
      '<div class="lede line" style="font-size:25px;margin-top:10px"><span>' + tr.note + '</span></div>',
      { left:'132px', top:'838px' });
    revealType(tl, lab, at+0.5, 0.06);
    hideType(tl, lab, at+d-0.75);

    at += d;
  });
}

/* ── 4 · THE GRID (72–80) ────────────────────────────────────────────── */
{
  const cam = $('#s4cam');
  const W = 430, H = 269, GX = 4, GY = 2, PADX = 40, PADY = 34;
  const tiles = TRADES.map((tr,i)=>{
    const s = screen(cam, tr.img, W, H);

  tl.fromTo(tiles, { opacity:0, z:-260 },
                   { opacity:1, z:0, duration:0.9, ease:EASE, stagger:0.06 }, 72);

/* ── 5 · FOUR SURFACES (80–106) — explode and reassemble ─────────────── */
{
  const cam = $('#s5cam');
  const W = 1340, H = 838;

  /* The dashboard as four strata. Each layer is the same capture clipped to
     its own band, so pulling them apart in Z reveals the real UI in slices. */
  const BANDS = [
    { clip:'inset(0 82% 0 0)',     dz:340, dx:-330, dy:-30 },
    { clip:'inset(6% 0 66% 18%)',  dz:210, dx:150,  dy:-190 },
    { clip:'inset(34% 0 26% 18%)', dz:80,  dx:210,  dy:20  },
    { clip:'inset(74% 0 0 18%)',   dz:-60, dx:170,  dy:220 },
  ];
  const layers = BANDS.map(b=>{
    const s = screen(cam, 'dashboard.png', W, H);
    s.style.clipPath = b.clip;
    s.style.boxShadow = '0 40px 90px -24px rgba(0,0,0,.8)';
    return s;
  });

  tl.fromTo(cam, { scale:1.34, z:300, rotateX:9, rotateY:-11, filter:'blur(6px)' },
                 { scale:1, z:0, rotateX:5, rotateY:-6, filter:'blur(0px)',
                   duration:3.4, ease:EASE }, 80);
  tl.fromTo(layers, { opacity:0 }, { opacity:1, duration:0.7, ease:EASE, stagger:0.07 }, 80);

  BANDS.forEach((b,i)=>{
    tl.to(layers[i], { z:b.dz, x:b.dx, y:b.dy, duration:2.6, ease:EASE }, 83.4 + i*0.13);
  });
  tl.to(cam, { rotateY:16, rotateX:-4, duration:6.4, ease:EASE_IO }, 83.4);

  const e1 = typeBlock(
    '<div class="eyebrow line"><span>Une seule matière</span></div>' +
    '<div class="h2 line" style="margin-top:18px"><span>La caisse, la salle, le téléphone,</span></div>' +
    '<div class="h2 ser line"><span>le tableau de bord.</span></div>',
    { left:'132px', top:'128px' });
  revealType(tl, e1, 84.4);
  hideType(tl, e1, 91.6);

  /* the snap back is the whole point of the section */
  BANDS.forEach((b,i)=>{
    tl.to(layers[i], { z:0, x:0, y:0, duration:1.9, ease:'power3.inOut' }, 92.2 + i*0.07);
  });
  tl.to(cam, { rotateY:-3, rotateX:3, scale:1.02, duration:3.2, ease:EASE }, 92.2);

  /* the sale travels: register → phone → dashboard */
  const spark = el('div','spark',cam);
  const trail = el('div','trail',cam);
  gsap.set(spark, { opacity:0, xPercent:-50, yPercent:-50, x:-540, y:250 });
  gsap.set(trail, { opacity:0, width:0, x:-540, y:250, rotate:-24 });
  tl.to(spark, { opacity:1, duration:0.3 }, 96.4);
  tl.to(trail, { opacity:1, duration:0.3 }, 96.4);
  tl.to(spark, { x:60,  y:-40,  duration:1.5, ease:'power2.inOut' }, 96.7);
  tl.to(trail, { width:640, duration:1.5, ease:'power2.inOut' }, 96.7);
  tl.to(spark, { x:470, y:-210, duration:1.3, ease:'power2.inOut' }, 98.2);
  tl.to(trail, { width:1080, rotate:-20, duration:1.3, ease:'power2.inOut' }, 98.2);
  tl.to([spark,trail], { opacity:0, duration:0.6, ease:'power2.in' }, 99.7);

  const e2 = typeBlock(
    '<div class="lede line"><span>Une vente entre à la caisse.</span></div>' +
    '<div class="lede line"><span>Elle est au tableau de bord avant que le client soit sorti.</span></div>',
    { left:'132px', top:'860px' });
  revealType(tl, e2, 99.9, 0.09);
  hideType(tl, e2, 104.9);
  tl.to(cam, { scale:1.12, rotateY:6, duration:5.2, ease:'none' }, 100);
  tl.to(layers, { opacity:0, duration:0.6, ease:'power2.in' }, 105.4);
}

/* ── 6 · THE HARD PARTS (106–128) ────────────────────────────────────── */
{
  const cam = $('#s6cam');
  const W = 1080, H = 675;
  const BEATS = [
    { img:'caisse-lock.png', k:'Hors ligne',  t:'Le réseau tombe. La caisse continue,<br>et rattrape toute seule au retour.' },
    { img:'order.png',       k:'Impression',  t:'Le ticket sort sur l\'imprimante thermique<br>que le commerçant a déjà.' },
    { img:'serveur.png',     k:'العربية',     t:'L\'interface entière se retourne.<br>Pas une traduction posée par-dessus.' },
  ];
  tl.fromTo(cam, { scale:1.1, rotateY:-8 }, { scale:1.0, rotateY:8, duration:22, ease:'none' }, 106);

  BEATS.forEach((b,i)=>{
    const at = 106 + i*7.333;
    const sh = shadowFor(cam, W);
    const s  = screen(cam, b.img, W, H);
    gsap.set(s, { opacity:0 }); gsap.set(sh, { opacity:0, y:H*0.52 });

    /* same overlap rule as the montage: arrive before the previous beat has
       cleared, so the cut is a dissolve and not a hole */
    const inAt = i === 0 ? at : at - 0.5;
    tl.fromTo(s, { opacity:0, z:-500, rotateY:26, filter:'blur(10px)' },
                 { opacity:1, z:0, rotateY:-6, filter:'blur(0px)', duration:1.0, ease:EASE }, inAt);
    tl.to(sh, { opacity:0.8, duration:1.0, ease:EASE }, inAt);
    /* Beat 3 owns rotateY for its flip — drifting it here too would put two
       tweens on one property and they would fight over the overlap. */
    tl.to(s, i === 2 ? { z:110, duration:4.6, ease:'none' }
                     : { z:110, rotateY:4, duration:4.6, ease:'none' }, at+1.5);

    /* The Arabic beat physically mirrors on camera — the flip IS the argument.
       rotateY, not scaleX: a scaleX mirror passes through zero width and the
       plane vanishes flat, which reads as a glitch. Turning it through 180°
       reads as an object being turned over, which is the point. */
    if(i === 2){
      tl.to(s, { rotateY:174, duration:1.7, ease:'power3.inOut' }, at+2.3);
      tl.to(s, { rotateY:4,   duration:1.7, ease:'power3.inOut' }, at+4.5);
    }
    /* holds a beat longer, then leaves quickly — same exit frame, less dead air */
    tl.to([s,sh], { opacity:0, z:-360, duration:0.5, ease:'power2.in' }, at+6.8);

    const lab = typeBlock(
      '<div class="eyebrow line"><span>' + b.k + '</span></div>' +
      '<div class="lede line" style="margin-top:16px;font-size:28px"><span>' + b.t + '</span></div>',
      { left:'132px', top:'842px' });
    revealType(tl, lab, at+0.7, 0.07);
    hideType(tl, lab, at+6.45);
  });
}

      cnum.textContent = Math.round(counter.v).toLocaleString('fr-FR').replace(/ | |,/g,' ') + ' MAD';
    }
  }, 136.4);

  const g = typeBlock(
    '<div class="lede line"><span>Le chiffre est calculé sur les ventes réelles,</span></div>' +
    '<div class="lede line"><span>et il montre lesquelles.</span></div>',
    { left:'132px', top:'128px' });
  revealType(tl, g, 141.6, 0.09);
  hideType(tl, g, 147.4);
  hideType(tl, a, 149.2);
  /* lands on 150.0 — the cut. Ending at 149.5 left a second of empty stage. */
  tl.to([s,sh], { opacity:0, duration:0.9, ease:'power2.in' }, 149.1);
}

/* ── 8 · PRICE (150–166) — the camera passes through the numerals ────── */
{
  const cam = $('#s8cam');
  const mega = el('div','mega',cam);
  mega.textContent = '199';
  gsap.set(mega, { xPercent:-50, yPercent:-50 });

  tl.to(cam, { scale:1.06, duration:3.4, ease:'none' }, 154.4);

  tl.to(cam, { scale:7.4, z:900, opacity:0, duration:2.0, ease:'power3.in' }, 157.8);
  /* the reset lands the instant the numerals clear frame — a 0.7s pause on
     empty green in the middle of the price beat read as a dropout */
  tl.set(cam, { opacity:1, scale:0.86, z:0 }, 159.85);
  tl.set(cs,  { opacity:0 }, 159.85);

  const p = typeBlock(
    '<div class="eyebrow line"><span>Kiwi Basic</span></div>' +
    '<div class="h1 line" style="margin-top:20px"><span>199 MAD par mois.</span></div>' +
    '<div class="lede line" style="margin-top:18px"><span>Appareils illimités. Un établissement.</span></div>' +
    '<div class="lede line"><span>Formation sur place et guides compris.</span></div>',

}

/* ── 9 · CLOSE (166–180) — the wordmark assembles from fragments ─────── */
{
  const cam = $('#s9cam');
  const wrap = el('div', null, cam);
  Object.assign(wrap.style, { position:'absolute', left:'50%', top:'50%',
    transform:'translate(-50%,-50%)', transformStyle:'preserve-3d' });

  const frags = [];
  for(let i=0;i<72;i++){
    const f = el('div','frag',wrap);
    f.style.width  = (6 + rnd()*54)+'px';
    f.style.height = (4 + rnd()*10)+'px';
    f.style.background = rnd() > 0.72 ? '#7DF2B0' : '#F7F5F0';
    gsap.set(f, { x:(rnd()*2-1)*1180, y:(rnd()*2-1)*620, z:(rnd()*2-1)*760,
                  rotateZ:(rnd()*2-1)*180, opacity:0 });
    frags.push(f);
  }
  tl.to(frags, { opacity:0.9, duration:0.5, ease:EASE, stagger:0.005 }, 166);
  frags.forEach((f,i)=>{
    tl.to(f, { x:(rnd()*2-1)*300, y:(rnd()*2-1)*26, z:0, rotateZ:0,
               duration:3.4, ease:'power3.inOut' }, 167.2 + (i%12)*0.03);
  });
  tl.to(frags, { opacity:0, duration:1.0, ease:'power2.in', stagger:0.004 }, 170.6);
  tl.fromTo(cam, { scale:1.3, rotateY:-12, z:-260 },
                 { scale:1, rotateY:0, z:0, duration:6.2, ease:EASE }, 166);

  const wm = typeBlock(
    '<div class="wm" style="font-size:150px">kiwi<span class="dot"></span></div>',
    { left:'50%', top:'46%', transform:'translate(-50%,-50%)', textAlign:'center' });
  tl.fromTo(wm, { opacity:0, scale:1.1, filter:'blur(12px)' },
                { opacity:1, scale:1, filter:'blur(0px)', duration:2.0, ease:EASE }, 170.4);

  const foot = typeBlock(
    '<div class="eyebrow line" style="letter-spacing:.26em">' +
    '<span>Badr-Eddin Bakkioui &nbsp;·&nbsp; Zakariae Attahiri &nbsp;·&nbsp; Tanger</span></div>',
    { left:'50%', top:'63%', transform:'translateX(-50%)', textAlign:'center' });
  revealType(tl, foot, 173.0);
  /* the final hold still breathes — a 2% creep, never a frozen frame */
  tl.to(wm,   { scale:1.02, duration:7.0, ease:'none' }, 172.5);
  tl.to(foot, { scale:1.01, duration:6.0, ease:'none' }, 173.5);
  tl.to([wm,foot], { opacity:0, duration:1.2, ease:'power2.in' }, 178.6);
}

/* ═════════════════════════════════════════════════════════════════════════
   SEEK — the only entry point. Pure function of t.
   ═════════════════════════════════════════════════════════════════════════ */
function setScene(t){
  for(const s of SCENES){
    s.el.style.display = (t >= s.in && t < s.out) ? 'block' : 'none';
  }
}
window.seek = function(t){
  const tc = Math.max(0, Math.min(DUR - 1e-4, t));
  setScene(tc);
  tl.time(tc);
  renderGL(tc);
};
window.__filmDuration = DUR;

/* Readiness: gate on `load`, never img.decode() — decode() never settles in a
   backgrounded tab and would stall the render forever. The hard ceiling means
   a missing still degrades to one blank plane instead of hanging the capture. */
(function ready(){
  const urls = [...IMAGES].map(n => 'stills/' + n);
  let left = urls.length, finished = false;
  function finish(){
    if(finished) return; finished = true;
    window.seek(0);
    window.__filmReady = true;
  }
  const done = () => { if(--left <= 0) finish(); };
  urls.forEach(u => { const im = new Image(); im.onload = done; im.onerror = done; im.src = u; });
  setTimeout(finish, 20000);
  if(!urls.length) finish();
})();
</script>
