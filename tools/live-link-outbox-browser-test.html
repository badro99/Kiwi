<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiwi live-link IndexedDB browser test</title>
<button id="run" type="button">Run live-link outbox tests</button>
<pre id="result">Not run</pre>
<script>
  window.KiwiEnv = { isReal: function () { return true; } };
  localStorage.setItem('kiwiLive', '1');
  window.__testTenant = 'browser-outbox-test-' + (new URLSearchParams(location.search).get('run') || Date.now());
  localStorage.setItem('kiwiPairedVenue', JSON.stringify({ merchant: window.__testTenant }));
  window.__fetchMode = 'fail';
  window.__posts = [];
  window.__failedPosts = 0;
  window.fetch = function (url, opts) {
    if (url === '/api/sale') {
      window.__posts.push(JSON.parse(opts.body));
      if (window.__fetchMode === 'ok' || window.__fetchMode === 'pending') return Promise.resolve(new Response(JSON.stringify({
        ok: true, id: window.__posts[window.__posts.length - 1].id,
        settlementPending: window.__fetchMode === 'pending'
      }), { status: 201 }));
      if (window.__fetchMode === 'blocked') return Promise.resolve(new Response(JSON.stringify({error:'bad-amount'}),{status:422}));
      if (window.__fetchMode === 'relaxed') return Promise.resolve(new Response(JSON.stringify({error:'table-session-missing'}),{status:404}));
      window.__failedPosts++;
      return Promise.reject(new Error('offline test'));
    }
    return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ sales: [], voided: [] }); } });
  };
</script>
<script src="../assets/vendor/dexie.min.js"></script>
<script src="../assets/offline-db.js?v=3"></script>
<script src="../assets/live-link.js"></script>
<script>
(function () {
  'use strict';
  var output = document.getElementById('result');
  var run = document.getElementById('run');
  function assert(value, message) { if (!value) throw new Error(message); }
  function line(message) { output.textContent += '\n✓ ' + message; }
  function waitFor(fn, timeout) {
    var start = Date.now();
    return new Promise(function (resolve, reject) {
      (function tick() {
        Promise.resolve(fn()).then(function (value) {
          if (value) return resolve(value);
          if (Date.now() - start > timeout) return reject(new Error('timeout'));
          setTimeout(tick, 25);
        }, reject);
      })();
    });
  }
  run.addEventListener('click', async function () {
    run.disabled = true;
    output.textContent = 'Running';
    var ref = 'BROWSER-' + Date.now();
    try {
      await KiwiOffline.ready();
      await new Promise(function (resolve) { setTimeout(resolve, 80); });
      window.__fetchMode = 'fail';
      var accepted = KiwiLive.postSale({ amount: 123, method: 'cash', label: 'Offline test', ref: ref });
      assert(accepted && accepted.ok && accepted.durable === 'indexeddb', 'uses IndexedDB');
      // Enqueued/pending is visible before the asynchronous first POST. Keep
      // the endpoint offline until a real failed attempt has happened.
      await waitFor(async function () { return window.__failedPosts > 0 && (await KiwiOffline.stats('sale', window.__testTenant)).pending === 1; }, 10000);
      line('a failed POST remains durable in IndexedDB');

      window.__fetchMode = 'ok';
      window.dispatchEvent(new Event('online'));
      await waitFor(async function () { return (await KiwiOffline.stats('sale', window.__testTenant)).total === 0; }, 10000);
      assert(window.__posts.length >= 2 && window.__posts.every(function (p) { return p.id === accepted.id; }), 'stable replay id');
      line('reconnect replays the same id and acknowledges it');

      window.__fetchMode = 'pending';
      var beforePending = window.__posts.length;
      KiwiLive.postSale({ id: ref + '-pending', amount: 60, method: 'cash', ref: ref + '-pending' });
      await waitFor(async function () { return (await KiwiOffline.stats('sale', window.__testTenant)).lastError === 'settlement-pending'; }, 10000);
      assert((await KiwiOffline.stats('sale', window.__testTenant)).total === 1, '200 pending stays durable');
      line('accepted money with pending settlement remains in real IndexedDB');
      window.__fetchMode = 'ok';
      // No manual flush: the transport must schedule recovery itself.
      await waitFor(async function () { return (await KiwiOffline.stats('sale', window.__testTenant)).total === 0; }, 15000);
      var pendingPosts = window.__posts.slice(beforePending);
      assert(pendingPosts.length >= 2 && pendingPosts.every(function (p) { return p.id === pendingPosts[0].id; }), 'pending replay retains its identity');
      line('scheduled settlement retry uses the same receipt and acknowledges completion');

      window.__fetchMode = 'blocked';
      var blockedReceipt = { amount: 44, method: 'card', label: 'Invalid test', ref: ref + '-blocked' };
      var blockedResult = KiwiLive.postSale(blockedReceipt);
      await waitFor(async function () { return (await KiwiOffline.stats('sale', window.__testTenant)).blocked === 1; }, 10000);
      assert(KiwiLive.queueStatus().blocked === 1, 'blocked status visible');
      line('a 422 response is retained and visible to the cashier');
      // Neither a missing receipt nor a click is evidence that 422 changed.
      var postsBefore = window.__posts.length;
      window.__fetchMode = 'ok';
      assert(await KiwiLive.retrySale(blockedReceipt) === false, 'no blind 422 replay');
      await KiwiLive.retryBlockedSales(); await KiwiLive.flush(true);
      assert(window.__posts.length === postsBefore, 'blocked 422 was not resent');
      var debt = (await KiwiOffline.stats('sale',window.__testTenant)).blockedEntries[0];
      assert(debt.amountCents === 4400 && debt.method === 'card' && debt.reason === 'bad-amount' && debt.ts > 0, 'support has amount, method, time and reason');
      line('422 stays quarantined with inspectable receipt details');
      // An old missing-visit rule was removed. A comparison-bound permit can
      // rearm exactly once, and never changes the queued financial payload.
      window.__fetchMode = 'relaxed';
      var relaxedReceipt = {id:ref+'-relaxed',amount:33,method:'cash',ref:ref+'-relaxed'};
      var relaxedResult = {id:KiwiLive.saleIdFor(relaxedReceipt,window.__testTenant)};
      await KiwiOffline.enqueue('sale',window.__testTenant,{id:relaxedResult.id,merchant:window.__testTenant,amount:33,amountCents:3300,method:'cash',ts:Date.now(),ref:relaxedReceipt.ref},{id:relaxedResult.id});
      var oldRow = await KiwiOffline.claim('sale',window.__testTenant,{force:true});
      await KiwiOffline.reject(oldRow.id,oldRow.leaseToken,{permanent:true,status:404,error:'table-session-missing'});
      var permit = {id:relaxedResult.id,merchant:window.__testTenant,reason:'table-session-missing',status:404,changed:'visit-rule-relaxed',comparisonId:'comparison-1',comparedAt:Date.now()};
      assert(await KiwiLive.retrySale(relaxedReceipt,permit) === true, 'changed rule permits retry');
      var again = await KiwiOffline.claim('sale',window.__testTenant,{force:true});
      await KiwiOffline.reject(again.id,again.leaseToken,{permanent:true,status:404,error:'table-session-missing'});
      assert(await KiwiLive.retrySale(relaxedReceipt,permit) === false, 'same comparison cannot rearm twice');
      var oldPermit = Object.assign({},permit);
      window.__fetchMode = 'ok'; permit.comparisonId = 'comparison-2'; permit.comparedAt++;
      assert(await KiwiLive.retrySale(relaxedReceipt,permit) === true, 'new comparison can verify the changed rule');
      var third = await KiwiOffline.claim('sale',window.__testTenant,{force:true});
      await KiwiOffline.reject(third.id,third.leaseToken,{permanent:true,status:404,error:'table-session-missing'});
      assert(await KiwiLive.retrySale(relaxedReceipt,oldPermit) === false, 'out-of-order old comparison cannot bypass retry cap');
      permit.comparisonId='comparison-3';permit.comparedAt++;
      assert(await KiwiLive.retrySale(relaxedReceipt,permit) === true, 'fresh evidence can retry');
      await KiwiLive.flush(true);
      await waitFor(async function(){return (await KiwiOffline.stats('sale',window.__testTenant)).total === 1;},10000);
      assert(window.__posts.at(-1).id === relaxedResult.id, 'immutable payment ID preserved');
      line('changed rule retries once per comparison without erasing the blocked 422');

      output.dataset.status = 'passed';
      output.textContent += '\n\nPASSED';
    } catch (err) {
      output.dataset.status = 'failed';
      output.textContent += '\n\nFAILED: ' + (err && err.message || err);
    } finally { run.disabled = false; }
  });
})();
</script>
</html>
