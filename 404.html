<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Kiwi</title>
<meta name="description" content="Cette page n'existe pas ou a été déplacée. Revenez à l'accueil de Kiwi, le système d'exploitation du commerçant marocain.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/assets/landing/kiwi-mark-app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;500&display=swap">
<style>
  /* Page 404 autonome — volontairement sans dépendance au bundle Next.
     Une page d'erreur qui dépend des chunks du site casse précisément le jour
     où le déploiement casse. Tout est en ligne ici ; les couleurs reprennent
     globals.css du site (--color-accent #00ffae, --color-line). */
  :root {
    --accent: #00ffae;
    --line: rgba(255,255,255,0.1);
    --fg: #fff;
    --fg-dim: rgba(255,255,255,0.7);
    --fg-faint: rgba(255,255,255,0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: clip; }
  html { background: #000; }
  body {
    min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(70% 55% at 50% 100%, rgba(0,255,174,0.10), transparent 70%),
      radial-gradient(50% 40% at 50% 0%, rgba(0,255,174,0.05), transparent 70%),
      #000;
    color: var(--fg);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="ar"] body { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; line-height: 1.7; }
  main { width: 100%; max-width: 560px; text-align: center; }
  .mark { display: inline-flex; min-height: 44px; align-items: center; }
  .mark img { height: 40px; width: auto; display: block; }
  .code {
    margin: 44px 0 0;
    font-size: clamp(76px, 22vw, 132px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.05em;
    color: var(--accent);
  }
  h1 {
    margin: 18px 0 0;
    font-size: clamp(22px, 5.4vw, 30px);
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.03em;
    overflow-wrap: anywhere;
  }
  .lede {
    margin: 14px auto 0;
    max-width: 40ch;
    font-size: 16px;
    line-height: 1.55;
    color: var(--fg-dim);
  }
  .actions {
    margin-top: 34px;
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 24px;
    border-radius: 999px;
    font-size: 16px; font-weight: 500; letter-spacing: -0.02em;
    text-decoration: none;
    transition: background-color 200ms ease, color 200ms ease, transform 120ms ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: #fff; color: #000; }
  .btn.primary:hover { background: rgba(255,255,255,0.9); }
  .btn.ghost { border: 1px solid var(--line); color: var(--fg); }
  .btn.ghost:hover { background: rgba(255,255,255,0.06); }
  .langs {
    margin-top: 40px; padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex; gap: 6px; justify-content: center;
  }
  .langs a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 52px;
    border-radius: 999px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.08em;
    color: var(--fg-faint); text-decoration: none;
    transition: color 200ms ease, background-color 200ms ease;
  }
  .langs a:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  .contact {
    margin-top: 26px;
    font-size: 14px; line-height: 1.6;
    color: var(--fg-faint);
  }
  .contact a { color: var(--fg-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .contact a:hover { color: var(--fg); }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 620ms cubic-bezier(0.32, 0.72, 0, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <a class="mark" href="/" aria-label="Kiwi · accueil">
    <img src="/images/kiwi-logo.svg" alt="Kiwi" width="855" height="455">
  </a>

  <p class="code">404</p>
  <h1 id="t-title">Cette page n'existe pas.</h1>
  <p class="lede" id="t-lede">Le lien est peut-être ancien, ou l'adresse comporte une faute. Tout le reste du site fonctionne normalement.</p>

  <div class="actions">
    <a class="btn primary" href="/" id="t-home">Retour à l'accueil</a>
    <a class="btn ghost" href="https://wa.me/212624495159" target="_blank" rel="noreferrer" id="t-help">Nous contacter</a>
  </div>

  <p class="contact">
    <a href="tel:+212624495159">+212 624 495 159</a> ·
    <a href="mailto:contact@kiwi-os.com">contact@kiwi-os.com</a>
  </p>

  <nav class="langs" aria-label="Langue">
    <a href="/fr/">FR</a>
    <a href="/en/">EN</a>
    <a href="/ar/">AR</a>
  </nav>
</main>

<script>
/* La page est servie telle quelle pour toutes les URL inconnues, y compris
   sous /en/ et /ar/ — le français seul laisserait un lecteur anglophone ou
   arabophone devant une langue qu'il n'a pas choisie. On lit d'abord le
   préfixe de l'URL demandée (signal le plus fiable), puis la langue du
   navigateur. Sans JavaScript le français reste affiché : la page est déjà
   complète, le script ne fait que la traduire. */
(function () {
  var T = {
    en: {
      lang: 'en', dir: 'ltr',
      title: 'This page does not exist.',
      lede: 'The link may be old, or the address has a typo. Everything else on the site is working normally.',
      home: 'Back to home',
      help: 'Contact us',
      docTitle: 'Page not found · Kiwi'
    },
    ar: {
      lang: 'ar', dir: 'rtl',
      title: 'هذه الصفحة غير موجودة.',
      lede: 'قد يكون الرابط قديماً أو العنوان يحتوي على خطأ. باقي الموقع يعمل بشكل طبيعي.',
      home: 'العودة إلى الصفحة الرئيسية',
      help: 'اتصل بنا',
      docTitle: 'الصفحة غير موجودة · Kiwi'
    }
  };

  var path = location.pathname.toLowerCase();
  var key = null;
  if (path.indexOf('/en/') === 0 || path === '/en') key = 'en';
  else if (path.indexOf('/ar/') === 0 || path === '/ar') key = 'ar';
  else if (path.indexOf('/fr/') === 0 || path === '/fr') key = 'fr';

  if (!key) {
    var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'fr').toLowerCase();
    if (nav.indexOf('ar') === 0) key = 'ar';
    else if (nav.indexOf('en') === 0) key = 'en';
    else key = 'fr';
  }

  var t = T[key];
  if (!t) return;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.docTitle;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-lede').textContent = t.lede;
  document.getElementById('t-home').textContent = t.home;
  document.getElementById('t-help').textContent = t.help;
  document.getElementById('t-home').setAttribute('href', '/' + t.lang + '/');
})();
</script>
</body>
</html>
