<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Kiwi Cuisine</title>
  <meta name="description" content="Écran cuisine Kiwi — les bons de la caisse arrivent ici, sans imprimante." />
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080B0A" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="cuisine.webmanifest" />
  <link rel="apple-touch-icon" href="assets/landing/kiwi-mark-app-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Le même jeu de fontes que le tableau de bord et la salle, à la lettre près.
       JetBrains Mono a disparu d'ici : assets/tokens.css l'écarte explicitement
       de --mono (« le même zéro clair que les codes-barres imprimés ») et cette
       page la chargeait quand même pour son horloge et ses quantités. IBM Plex
       Sans Arabic entre parce que la brigade lit désormais l'écran en arabe. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Les jetons de marque, partagés avec le tableau de bord et la caisse.
       L'écran cuisine est le MÊME produit vu depuis le passe : il n'a pas sa
       propre palette. Le timbre compte : sans ?v=, une modification des jetons
       n'atteint jamais une tablette déjà ouverte — l'URL est identique au byte
       près et le service worker sert la copie tiède. -->
  <link rel="stylesheet" href="assets/tokens.css?v=2050" />

  <!-- Le climat, posé AVANT la première peinture. Sans ce bloc la tablette
       s'ouvrirait en clair puis basculerait — un flash blanc en pleine nuit,
       au-dessus d'un piano de cuisson. On résout « auto » ici en attribut
       explicite : une seule définition de la nuit plus bas, jamais deux
       palettes à tenir d'accord. -->
  <script>
    (function () {
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      function apply() {
        var t = null;
        try { t = localStorage.getItem('kiwiTheme'); } catch (_) {}
        if (t !== 'dark' && t !== 'light') t = (mq && mq.matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].removeAttribute('media');
          metas[i].setAttribute('content', t === 'dark' ? '#080B0A' : '#F7F5F0');
        }
      }
      /* Le système ne reprend la main que si personne n'a tranché ici. */
      if (mq && mq.addEventListener) mq.addEventListener('change', function () {
        var t = null;
        try { t = localStorage.getItem('kiwiTheme'); } catch (_) {}
        if (t !== 'dark' && t !== 'light') apply();
      });
      window.__kiwiApplyTheme = apply;
      apply();
    })();
  </script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       KIWI CUISINE — l'écran du passe
       -----------------------------------------------------------------------
       Une tablette, posée à hauteur d'yeux, lue à deux mètres, les mains
       occupées. Trois conséquences qui expliquent tout ce qui suit :
         · les chiffres sont GROS et le contraste franc — on lit de loin, dans
           la vapeur, avec des lunettes embuées ;
         · les cibles tactiles font 56 px minimum — on tape avec le dos du
           doigt, ou à travers un gant ;
         · rien ne s'imprime. La tablette EST le passe. Il n'y a volontairement
           aucun bouton d'impression sur cette page.
       ═══════════════════════════════════════════════════════════════════════ */
    /* ── Les jetons de cet écran ────────────────────────────────────────────
       Ils ne redéfinissent plus ni les fontes ni les neutres : assets/tokens.css
       les porte déjà, et les recopier ici est précisément ce qui faisait deux
       produits. Ce qui reste est ce que le passe seul possède — des ALIAS de
       rôle qui pointent dans l'échelle partagée, pour que la nuit n'ait qu'un
       seul endroit à retourner.

       Ce que ce bloc contenait et qui est parti :
         --sans/--serif/--mono   recopiés, dont JetBrains Mono que le tableau
                                 de bord écarte exprès (zéro pointé sous
                                 Windows) — l'horloge murale et les quantités
                                 tournaient donc dans une fonte bannie ;
         --warn-ink              doublon exact de tokens.css ;
         #E5E5E5 #EEEEEE #4A4A4A #6B6B6B  quatre gris FROIDS inventés, quand
                                 l'échelle partagée --n-* est tiède de bout en
                                 bout : c'est ce qui donnait à cet écran son
                                 air d'utilitaire posé à côté du produit. */
    :root {
      --forest:      var(--atlas);
      /* PEINTURE : l'extrémité sombre du dégradé de « Prête ». */
      --forest-deep: var(--riad);
      /* ENCRE : les pastilles « Table 12 » et les repères visuels d'un plat.
         Les deux rôles partageaient --forest-deep. En clair ça passe — les
         deux sens veulent un vert sombre. La nuit les sépare : le dégradé
         veut toujours un vert sombre, la pastille veut un vert CLAIR sur son
         fond sombre. Un seul nom rendait #0B6E4F sur #12241C, soit 2,59:1 sur
         le numéro de table que le passe crie à la salle. */
      --forest-ink:  var(--riad);

      /* Rouge d'ALERTE, pas de décor. L'ancien #B85245 mesurait 4,45:1 sur le
         papier — sous le plancher de 4,5, sur le seul libellé qu'une brigade
         doit lire de loin. Celui-ci tient 5,61:1 sur le papier et 4,95:1 sur
         son propre fond teinté. */
      --danger-ink:  #AE3A2A;

      --line:      var(--n-200);
      --line-soft: var(--n-100);
      --ink-2:     var(--n-600);
      --ink-3:     var(--n-500);
      /* Le bouton « son coupé » ne se signale PAS par sa couleur : un gris
         assez pâle pour lire « éteint » ne tient pas les 3:1 d'une icône. Le
         glyphe change (haut-parleur barré), l'encre reste lisible. */
      --ink-4:     var(--n-500);
      --paper-soft: var(--n-50);
      --paper-mute: var(--paper-soft-t);
      --mint-tint:  #EBF5F0;

      /* Fonds teintés des minuteurs et des pastilles. Nommés pour que la nuit
         les retourne d'un bloc au lieu d'être écrits en dur dans dix règles. */
      --paper-soft-t: #EFECE3;
      --tint-ok:    rgba(11,110,79,.10);
      --tint-warn:  rgba(217,154,43,.17);
      --tint-over:  rgba(174,58,42,.13);
      --tint-note:  rgba(217,154,43,.14);
      --tint-new:   rgba(11,110,79,.09);
      --tint-late:  rgba(174,58,42,.12);
      --tint-pass-edge: rgba(11,110,79,.40);
      --on-forest:  #EAFFF4;

      /* Le SLAB : le poste sélectionné, et « Je prends ». Une dalle franche
         portant du texte. Il s'écrivait `background: var(--ink); color: #fff`
         — correct tant que l'encre est sombre, et catastrophique dès que la
         nuit la retourne : le fond serait devenu #F1EFE9 avec du blanc dessus.
         Même piège que la note des surfaces inverses dans tokens.css : un seul
         nom, deux sens, aucune erreur — juste la mauvaise couleur. */
      --fill-strong: var(--ink);
      --on-strong:   var(--surface);

      --pad-fill:   rgba(255,255,255,.04);
      --pad-line:   rgba(255,255,255,.10);
      --pair-bg:    #07130F;
      --pair-ink:   #FFFFFF;
      /* Encre de la touche « Valider », sur un vert qui ne bascule jamais. */
      --pair-ok-ink: #EAFFF4;
      --pair-err:   #F0B3A4;
    }

    /* ── La nuit ────────────────────────────────────────────────────────────
       Un service du soir se fait dans une cuisine éclairée à la plaque. Cet
       écran, lui, restait un aplat #F7F5F0 de 10 pouces braqué sur le passe :
       la seule surface blanche de la pièce. Le tableau de bord et la salle
       avaient déjà leur nuit ; le passe, non.

       On retourne les JETONS, pas les règles — chaque valeur ci-dessous a un
       correspondant exact au-dessus, donc rien en bas de la feuille n'a besoin
       de savoir quel climat tourne. */
    html[data-theme="dark"] {
      --paper:       #080B0A;
      --surface:     #101614;
      --paper-soft:  #161E1B;
      --paper-soft-t:#161E1B;
      --paper-mute:  #1E2823;
      --ink:         #F1EFE9;
      --ink-2:       #C3C9C5;
      --ink-3:       #A8B0AB;
      --ink-4:       #A8B0AB;
      --line:        #232D29;
      --line-soft:   #1A211E;

      /* Le vert de marque est une ENCRE ici, plus une peinture : #0B6E4F sur
         un fond noir tombe à 1,9:1. La menthe le remplace partout où le vert
         portait du texte, et garde son fond sombre là où elle remplit. */
      --forest:      #7DF2B0;
      /* L'extrémité sombre du dégradé de « Prête » ne peut PAS rester le vert
         Atlas la nuit : l'encre du bouton est sombre dans ce climat, et
         #06281A sur #0B6E4F mesure 2,53:1 — sur la touche la plus pressée de
         l'écran, celle qu'on frappe sans regarder. L'émeraude partagée tient
         6,17:1 et garde la descente du dégradé. */
      --forest-deep: var(--emerald);
      --forest-ink:  #7DF2B0;
      --danger-ink:  #FF9A8A;
      --warn-ink:    #F0C36B;
      --mint-tint:   #12241C;
      --tint-ok:     rgba(125,242,176,.14);
      --tint-warn:   rgba(240,195,107,.16);
      --tint-over:   rgba(255,154,138,.16);
      --tint-note:   rgba(240,195,107,.14);
      --tint-new:    rgba(125,242,176,.13);
      --tint-late:   rgba(255,154,138,.15);
      --on-forest:   #06281A;
      --fill-strong: #7DF2B0;
      --on-strong:   #06281A;
      --pair-bg:     #05100C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      /* Une tablette au passe ne se sélectionne pas, ne se zoome pas et ne
         rebondit pas : chaque geste parasite est un bon mal bumpé. */
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
    svg { stroke-linecap: round; stroke-linejoin: round; }
    /* Le romain, partout. Voir la note de marque : l'italique en interface est
       la signature la plus lisible d'une page fabriquée à la va-vite. */
    em, i, cite { font-style: normal; }

    /* ── L'appareil n'est encore lié à aucun commerce ─────────────────────────
       Cet écran était un dégradé vert boueux : un « Cuisine » en serif de
       34 px posé contre un logo d'une tout autre graisse, et des touches
       molles à 18 px de rayon. Il ne ressemblait ni à la page d'accueil ni au
       reste du produit.

       Il reprend maintenant la langue de la page d'accueil : un aplat sombre
       (aucun dégradé), des filets à 10 % de blanc, un rayon de 14 px, une
       seule voix typographique, le vert de marque réservé au strict minimum —
       les pastilles saisies et la touche de validation. Rien d'autre ne
       brille. ───────────────────────────────────────────────────────────── */
    /* Cet écran est une dalle sombre dans LES DEUX climats — c'est un seuil,
       pas une surface de travail. Il ne suit donc pas --forest, qui devient
       menthe la nuit : sa touche de validation resterait verte avec une encre
       presque blanche dessus, soit 1,4:1. Le vert de marque est nommé en clair
       ici (--atlas), et il ne bouge pas. */
    #pair {
      position: fixed; inset: 0; z-index: 60;
      background: var(--pair-bg);
      color: var(--pair-ink); display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 0; padding: 30px;
    }
    #pair.on { display: flex; }
    #pair .kw {
      display: flex; align-items: center; gap: 12px;
      font-size: 19px; font-weight: 500; letter-spacing: -0.01em;
      color: rgba(255,255,255,.88);
    }
    #pair .kw img { display: block; width: auto; height: 26px; }
    #pair .kw span {
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.62);
    }
    #pair .sub {
      font-size: 14px; color: rgba(255,255,255,.5);
      margin: 14px 0 30px; text-align: center; line-height: 1.55;
      max-width: 34ch; letter-spacing: -0.005em;
    }
    .dots { display: flex; gap: 12px; margin-bottom: 30px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,.16);
      transition: background 150ms cubic-bezier(0,0,.2,1);
    }
    .dot.on { background: var(--mint); }
    .pad { display: grid; grid-template-columns: repeat(3, 84px); gap: 10px; }
    .pad button {
      height: 66px; border-radius: 14px;
      background: var(--pad-fill);
      border: 1px solid var(--pad-line);
      color: var(--pair-ink); font-size: 22px; font-weight: 500;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: -0.01em;
      transition: background 150ms cubic-bezier(0,0,.2,1),
                  border-color 150ms cubic-bezier(0,0,.2,1);
    }
    .pad button:active { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
    /* Effacer / Valider : du texte, pas des chiffres — ils descendent d'un cran
       dans la hiérarchie, et seule la validation porte le vert. */
    .pad button.wide { grid-column: span 1; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.6); }
    .pad button.wide.ok { background: var(--atlas); border-color: var(--atlas); color: var(--pair-ok-ink); font-weight: 600; }
    .pad button.wide.ok:active { background: var(--atlas-600); border-color: var(--atlas-600); }
    #pair-msg { min-height: 22px; margin-top: 22px; font-size: 13.5px; color: var(--pair-err); letter-spacing: -0.005em; }
    #pair.err { animation: shake .4s; }
    @keyframes shake { 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(5px)} 50%{transform:translateX(-8px)} }

    /* ── L'écran ────────────────────────────────────────────────────────────── */
    .screen { height: 100%; display: flex; flex-direction: column; }

    .top {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 20px; background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: baseline; gap: 9px; flex-shrink: 0; }
    .brand b { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -0.01em; }
    .brand .store { font-size: 13px; color: var(--ink-3); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top .spacer { flex: 1; }
    .clock { font-family: var(--mono); font-size: 21px; font-weight: 600; letter-spacing: -0.02em; font-feature-settings: "tnum" 1; }
    /* 56 px, comme l'annonce l'en-tête de cette feuille. Ils faisaient 46 :
       l'écran promettait une cible gantée et livrait une cible d'ongle. */
    .tool {
      width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line);
      background: var(--surface); display: grid; place-items: center; color: var(--ink-3);
      flex-shrink: 0;
      transition: background 120ms, border-color 120ms, transform 90ms;
    }
    .tool svg { width: 23px; height: 23px; }
    .tool:active { background: var(--paper-mute); transform: scale(.94); }
    .tool.off { color: var(--ink-4); }
    /* La langue est un mot, pas un drapeau : « ع » est plus vite lu par la
       brigade que n'importe quel fanion, et un drapeau ne désigne pas une
       langue. */
    .tool--lang { font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--ink-2); }

    /* ── L'arabe ─────────────────────────────────────────────────────────────
       assets/tokens.css bascule --sans sur IBM Plex Sans Arabic dès que
       <html lang="ar">, donc la fonte se règle seule. Restent les trois choses
       qu'un simple dir="rtl" ne retourne pas correctement ici. */
    html[dir="rtl"] .brand .store,
    html[dir="rtl"] .tk-note { text-align: right; }
    /* Les colonnes se relisent de droite à gauche d'elles-mêmes (grid suit la
       direction). Le minuteur, lui, est un nombre : il reste LTR, sinon
       « 02:45 » se lit « 45:02 ». */
    html[dir="rtl"] .tk-timer,
    html[dir="rtl"] .clock,
    html[dir="rtl"] .tk-q,
    html[dir="rtl"] .st .ct { direction: ltr; unicode-bidi: isolate; }
    html[dir="rtl"] .tk-visual { padding: 5px 7px 5px 9px; }
    /* Les noms de plats, de serveurs et d'établissement viennent du commerçant
       et restent souvent en latin. Sans isolation, la ponctuation finale part
       à l'autre bout — « Samir B. » s'affiche « .Samir B ». C'est du texte
       étranger dans un flux arabe, pas du texte arabe. */
    html[dir="rtl"] .chip.who,
    html[dir="rtl"] .brand .store,
    html[dir="rtl"] .tk-n,
    html[dir="rtl"] .tk-note,
    html[dir="rtl"] .st span { unicode-bidi: isolate; }
    /* Le lien vivant avec le comptoir. Une cuisine qui ne reçoit plus rien doit
       le SAVOIR : sans ce point, un wifi tombé ressemble exactement à un
       service calme, et on ne s'en aperçoit qu'aux clients qui s'impatientent. */
    .link { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); flex-shrink: 0; }
    .link i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-4); display: block; }
    .link.ok i { background: var(--forest); }
    .link.down i { background: var(--danger-ink); animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .28; } }
    /* Le clignotement est le SEUL signal d'urgence de cette ligne, et la règle
       « mouvement réduit » plus bas l'éteint. Un cuisinier qui a coché cette
       préférence sur la tablette perdait donc l'alerte réseau — la couleur
       seule ne dit pas « en ce moment ». On la remplace par une bordure
       franche, qui ne bouge pas et se voit d'aussi loin. */
    @media (prefers-reduced-motion: reduce) {
      .link.down i { box-shadow: 0 0 0 3px var(--tint-late); }
      .link.down { color: var(--danger-ink); }
    }

    .bar {
      display: flex; align-items: center; gap: 9px; padding: 11px 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
    }
    .bar::-webkit-scrollbar { display: none; }
    /* Le même composant que la barre de postes de la caisse (.kit-station) —
       c'est le MÊME écran cuisine vu d'un autre appareil, pas un second style
       de sélection. */
    .st {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0 16px; min-height: 56px;
      flex-shrink: 0; border-radius: 14px; border: 1px solid var(--line);
      background: var(--surface); font-size: 14px; font-weight: 500;
      color: var(--ink-2); white-space: nowrap;
      transition: background 130ms, border-color 130ms, color 130ms, transform 90ms;
    }
    .st:active { transform: scale(.97); }
    .st i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .st.on { background: var(--fill-strong); border-color: var(--fill-strong); color: var(--on-strong); }
    .st .ct {
      font-family: var(--mono); font-size: 12px; font-weight: 600; line-height: 1;
      padding: 3px 7px; border-radius: 999px; background: var(--paper-soft); color: var(--ink-2);
    }
    .st.on .ct { background: color-mix(in srgb, var(--on-strong) 22%, transparent); color: var(--on-strong); }

    .cols { flex: 1; display: grid; grid-template-columns: 1.05fr 1.55fr 1fr; gap: 1px; background: var(--line-soft); min-height: 0; }
    /* padding: 0 n'est PAS décoratif. assets/tokens.css porte un sélecteur
       d'élément nu — `section { padding: 96px 0 }`, pensé pour les pages
       vitrines — et les trois colonnes du passe sont des <section>. Le reset
       `*` de cette feuille a une spécificité de 0 et perd contre lui : chaque
       colonne portait donc 96 px de vide en haut ET en bas, soit près de
       200 px volés à un écran mural, et le premier bon poussé sous la ligne
       de flottaison. Rien ne le signalait — la page rendait 200, la console
       restait vide. Mesurer ce qui peint, pas ce qui est écrit. */
    .col { background: var(--paper); display: flex; flex-direction: column; min-height: 0; padding: 0; }
    .col-head {
      display: flex; align-items: center; gap: 10px; padding: 13px 17px 11px;
      font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-3); flex-shrink: 0;
    }
    .col-head .n {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0;
      padding: 3px 8px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); color: var(--ink-2);
    }
    .stack { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 15px 22px; display: flex; flex-direction: column; gap: 12px; }
    .col--cook .stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); align-content: start; }

    /* ── Un bon ─────────────────────────────────────────────────────────────── */
    .tk {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 15px; overflow: hidden; display: flex; flex-direction: column;
      /* La colonne défile ; les bons, eux, ne se compriment JAMAIS. Sans ça,
         deux bons dans une colonne courte se partagent la hauteur, `overflow:
         hidden` rogne le bas de la carte, et c'est le bouton — la seule chose
         qu'on vienne y toucher — qui disparaît en premier. */
      flex-shrink: 0;
    }
    .tk.is-new { border: 2px solid var(--forest); box-shadow: 0 0 0 4px var(--tint-new); }
    .tk.is-late { border-color: var(--danger-ink); }
    .tk.is-late.is-new { box-shadow: 0 0 0 4px var(--tint-late); }
    .tk-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 15px 0; }

    .tk-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 15px 0; }
    .chip { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; }
    .chip.table { background: var(--mint-tint); color: var(--forest-ink); }
    .chip.away  { background: var(--paper-mute); color: var(--ink-2); }
    .chip.who   { background: none; color: var(--ink-3); padding-left: 0; font-weight: 500; }
    .tk-items { list-style: none; padding: 12px 15px 4px; display: flex; flex-direction: column; gap: 9px; }

       `opacity: .3` — soit 2,00:1 sur la surface, sous le plancher de 3:1 même
       pour du gros texte. Or c'est justement ce qu'un cuisinier lit pour savoir
       ce qui reste à faire sur le bon, à deux mètres et dans la vapeur. Le
       retrait passe donc par la BARRE et l'encre secondaire (5,16:1), pas par
       l'effacement. */
    .tk-items li.off { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
    .tk-items li.off .tk-q { color: var(--ink-3); }
    .tk-q { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--forest); min-width: 30px; flex-shrink: 0; }
    .tk-n { font-weight: 500; }
    .tk-formula-tag {
      display: inline-block; margin-right: 6px; font-size: 13px; font-weight: 700;
      color: var(--forest-ink); background: var(--mint-tint);
      border-radius: 6px; padding: 2px 7px; vertical-align: middle;

    .tk-note {
      display: block; margin-top: 3px; font-size: 14px; font-weight: 600;
      color: var(--warn-ink); background: var(--tint-note);

    }

    .tk-visual { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 7px;
      border-radius: 8px; color: var(--forest-ink); background: var(--mint-tint); font-size: 14px; font-weight: 700; }

      margin: 12px 13px 13px; height: 58px; border-radius: 13px;
      font-size: 17px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; gap: 9px; transition: filter 120ms, transform 120ms;
    }
    .tk-act:active { transform: scale(.985); filter: brightness(.95); }

       maison, et ses touches montent à 56 px comme le reste du passe : on y

       d'urgence, et le mode « mouvement réduit » l'éteint. La bordure épaissit
       alors au lieu de battre. */

    }

      display: flex; gap: 8px;

    .act-void-accept {

      background: var(--danger-ink); color: var(--surface);
    }
    .act-void-reject {
      border: 1px solid var(--line);
      background: var(--surface); color: var(--ink-2);
    }

    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--ink-4); font-size: 14.5px; text-align: center;
      padding: 46px 20px; line-height: 1.6;
    }

    /* Tablette portrait / petit écran : les trois colonnes ne tiennent plus. */
    @media (max-width: 900px) {
      .cols { grid-template-columns: 1fr 1fr; }
      .col--pass { display: none; }
      .cols.show-pass { grid-template-columns: 1fr; }
      .cols.show-pass .col--new, .cols.show-pass .col--cook { display: none; }
      .cols.show-pass .col--pass { display: flex; }
    }
    @media (max-width: 620px) {
      .cols { grid-template-columns: 1fr; }
      .col--cook { display: none; }
      .brand .store { display: none; }
      .top { gap: 8px; padding: 10px 12px; }
      .brand b { font-size: 21px; }
      .link span { display: none; }
      .link { gap: 0; }
      .clock { font-size: 17px; }
      /* Les outils NE rétrécissent PLUS sous les 56 px annoncés en tête de
         feuille : ils passaient à 44 ici, c'est-à-dire que la promesse « on
         tape à travers un gant » tombait précisément sur le plus petit écran.
         C'est la barre qui cède — elle défile — pas la cible. */
      .top { overflow-x: auto; scrollbar-width: none; }
      .top::-webkit-scrollbar { display: none; }
      /* 100vw compte la barre de défilement et déborde d'autant sur un bureau ;
         le parent porte déjà sa marge. */
      .pad {
        width: min(278px, 100%);
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* Focus is NOT declared here on purpose. assets/tokens.css, which this page
       links, already ships a global

       invisible. */

    /* ── Reduced motion ───────────────────────────────────────────────────
       Five animated rules on this page, none of them load-bearing: they mark
       arrivals and state changes that the colour and position already state.
       Honouring the OS setting costs the screen nothing. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

  /* ── L'appairage ─────────────────────────────────────────────────────────── */
  var buf = '';
  function paired() { return ls('kiwiPaired') === '1' && !!ls('kiwiLiveMerchant'); }
  function venue() { try { return JSON.parse(ls('kiwiPairedVenue') || 'null'); } catch (_) { return null; } }

  function drawPad() {
    $('pair-dots').innerHTML = [0, 1, 2, 3, 4, 5].map(function (i) {
      return '<span class="dot' + (i < buf.length ? ' on' : '') + '"></span>';
    }).join('');
    if (!$('pair-pad').childNodes.length) {
      $('pair-pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
        return '<button data-k="' + n + '">' + n + '</button>';
      }).join('') + '<button class="wide" data-k="del">' + T('pair.clear') + '</button>'
        + '<button data-k="0">0</button><button class="wide ok" data-k="ok">' + T('pair.ok') + '</button>';
    }
  }
  function padFail(msg) {
    $('pair-msg').textContent = msg;
    var p = $('pair');
    p.classList.add('err');
    setTimeout(function () { p.classList.remove('err'); }, 420);
    buf = ''; drawPad();
  }
  function redeem() {
    if (buf.length !== 6) return;
    var code = buf;
    $('pair-msg').textContent = '';
    fetch('/api/pair/redeem', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code }),
    }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (j) {
        if (!j || !j.ok || !j.merchant) {
          padFail(j && j.error === 'too_many_attempts'
            ? T('pair.err.attempts')
            : T('pair.err.code'));
          return;
        }
        /* Poser l'appairage passe par le geste PARTAGÉ avec la caisse
           (assets/pairing-commit.js). Écrire les quatre clés ici, comme on le
           faisait, laissait cette tablette hériter de tout l'état local du
           commerce précédent : ses ventes, son catalogue, ses établissements,
           son service en cours — mêmes clés, même origine que la caisse, sans
           la purge. Le module manque ⇒ on REFUSE d'appairer, plutôt que de
           lier un nouveau commerçant par-dessus les données de l'ancien. */
        var commit = window.KiwiPairingCommit && window.KiwiPairingCommit.commit;
        if (!commit) { padFail(T('pair.err.incomplete')); return; }
        var res = commit(code, j, {
          /* Nouveau commerce ⇒ l'état local de l'ANCIEN n'a plus de sens : les
             bons « je m'en occupe » désignaient la cuisine d'un autre
             restaurant. La purge partagée emporte déjà COOK_KEY ; la mémoire
             vive de CETTE page, elle, n'appartient qu'à elle. */
          onTenantSwitch: function () { S.cooking = {}; S.orders = {}; S.since = 0; S.seen = {}; },
        });
        if (!res || !res.ok) { padFail(T('pair.err.commit')); return; }
        /* Ré-appairage au MÊME commerce (on rebranche la même cuisine) : rien
           n'a été purgé, mais la file repart d'un état propre comme avant. */
        if (!res.switched) { put(COOK_KEY, '[]'); S.cooking = {}; S.orders = {}; S.since = 0; S.seen = {}; }
        start();
      })
      .catch(function () { padFail(T('pair.err.net')); });
  }

  document.addEventListener('click', function (e) {
    var k = e.target.closest('[data-k]');
    if (!k) return;
    var v = k.dataset.k;
    if (v === 'del') buf = buf.slice(0, -1);
    else if (v === 'ok') { redeem(); return; }
    else if (buf.length < 6) buf += v;
    drawPad();
    if (buf.length === 6) setTimeout(redeem, 130);
  });
  document.addEventListener('keydown', function (e) {
    if (!$('pair').classList.contains('on')) return;
    if (/^[0-9]$/.test(e.key) && buf.length < 6) { buf += e.key; drawPad(); if (buf.length === 6) setTimeout(redeem, 130); }
    else if (e.key === 'Backspace') { buf = buf.slice(0, -1); drawPad(); }
    else if (e.key === 'Enter') redeem();
  });

  /* ── Les postes du commerçant ────────────────────────────────────────────
   * Ils viennent de la carte publiée depuis le tableau de bord, dans l'ordre
   * voulu par le patron — c'est l'ordre des onglets. Le bon, lui, porte déjà
   * son poste sur chaque ligne : cette lecture ne sert qu'aux LIBELLÉS et aux
   * couleurs du filtre. Carte injoignable ⇒ pas de barre, et l'écran affiche
   * tout : mieux vaut un filtre absent qu'un filtre qui cache des plats. */
  var PALETTE = ['#1F5D3C', '#3FB67A', '#D99A2B', '#3677A6', '#164A2F', '#C24A2E', '#C97A4A'];
  function loadStations() {
    var m = ls('kiwiLiveMerchant') || '';
    if (!m) return;
    fetch('/api/menu?merchant=' + encodeURIComponent(m), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var st = (j && j.menu && j.menu.stations) || [];
        S.stations = st.map(function (s, i) {
          return { id: s.id, name: s.name, color: /^#[0-9a-fA-F]{6}$/.test(s.color || '') ? s.color : PALETTE[i % PALETTE.length] };
        });
        if (j && j.name) { $('store-name').textContent = j.name; }
        if (S.station !== 'all' && !S.stations.some(function (s) { return s.id === S.station; })) S.station = 'all';
        paint();
      })
      .catch(function () {});
  }

  /* ── La file ─────────────────────────────────────────────────────────────── */
  function pull() {
    if (!window.KiwiKitchenRelay) return;
    KiwiKitchenRelay.pull(S.since, 'kitchen').then(function (j) {
      if (!j || !j.ok) { setLive(false); return; }
      setLive(true);
      /* Premier tour après un chargement : on RELIT tout ce qui est encore
         ouvert, ce qui est exactement ce qu'on veut — mais ce n'est pas une
         arrivée. Sonner ici ferait carillonner la tablette à chaque
         rechargement, en plein service, pour des bons déjà connus. */
      var firstPass = S.since === 0;
      S.since = j.now || S.since;
      var fresh = 0;
      /* Le serveur ne renvoie plus les bons du service précédent. Une tablette
         restée ouverte les a toutefois déjà en mémoire : retire-les même
         lorsqu'aucune nouvelle ligne ne revient pour eux. */
      Object.keys(S.orders).forEach(function (id) {
        var old = S.orders[id];
        if (old && old.created_ts && (Date.now() - old.created_ts) > STALE_MS) {
          delete S.orders[id]; delete S.cooking[id];
        }
      });
      var newVoidAlerts = 0;
      (j.orders || []).forEach(function (o) {
        if (!o || !o.id) return;
        /* Un bon `pending` appartient encore au comptoir : la cuisine ne doit
           pas lancer un plat que le caissier va peut-être refuser. */
        if (o.status === 'pending' || o.status === 'rejected') { delete S.orders[o.id]; return; }
        if (o.status === 'served') { delete S.orders[o.id]; delete S.cooking[o.id]; return; }
        /* Défense locale complémentaire à la borne de la file serveur. */
        if (o.created_ts && (Date.now() - o.created_ts) > STALE_MS) { delete S.orders[o.id]; return; }
        if (!S.seen[o.id] && o.status === 'accepted') { if (!firstPass) fresh++; S.seen[o.id] = 1; }
        if (Array.isArray(o.lines)) {
          o.lines.forEach(function (l) {
            if (l && l.voidAlert && l.voidAlert.id && !S.seenVoids[l.voidAlert.id]) {
              S.seenVoids[l.voidAlert.id] = 1;
              if (!firstPass) newVoidAlerts++;
            }
          });
        }
        S.orders[o.id] = o;
      });
      if (newVoidAlerts) announceVoid();
      else if (fresh) announce(fresh);
      saveCooking();
      paint();
    });
  }

  function setLive(up) {
    if (S.live === up) return;
    S.live = up;
    var el = $('link');
    el.className = 'link ' + (up ? 'ok' : 'down');
    $('link-txt').textContent = T(up ? 'link.up' : 'link.down');
  }

  /* Un bon qui arrive ne doit pas pouvoir passer inaperçu : personne ne
     regarde l'écran en permanence, on regarde la plaque. */
  function announce(n) {
    try { if (navigator.vibrate) navigator.vibrate([50, 70, 50]); } catch (_) {}
    if (S.muted) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [784, 1046].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        var t0 = ctx.currentTime + i * 0.17;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.36);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + 0.38);
      });
      setTimeout(function () { try { ctx.close(); } catch (_) {} }, 1100);
    } catch (_) {}
  }

  /* Une alerte d'annulation doit sonner fort et distinctement pour que le cuisinier arrête immédiatement la cuisson */
  function announceVoid() {
    try { if (navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 150]); } catch (_) {}
    if (S.muted) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [880, 660, 440].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = f;
        var t0 = ctx.currentTime + i * 0.2;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + 0.2);
      });
      setTimeout(function () { try { ctx.close(); } catch (_) {} }, 1200);
    } catch (_) {}
  }

  /* ── L'état local « je m'en occupe » ─────────────────────────────────────── */
  function loadCooking() {
    try {
      var a = JSON.parse(ls(COOK_KEY) || '[]');
      if (Array.isArray(a)) a.forEach(function (id) { S.cooking[id] = true; });
    } catch (_) {}
  }
  function saveCooking() {
    // On ne garde que ce qui est encore sur le tableau : sinon la liste
    // grossit tout le service et finit par déborder le stockage.
    var keep = Object.keys(S.cooking).filter(function (id) { return !!S.orders[id]; });
    var next = {};
    keep.forEach(function (id) { next[id] = true; });
    S.cooking = next;
    put(COOK_KEY, JSON.stringify(keep));
  }

  /* ── Rendu ───────────────────────────────────────────────────────────────── */
  function elapsed(o) { return Math.max(0, Math.floor((Date.now() - (o.created_ts || Date.now())) / 1000)); }
  function urgency(s) { return s < WARN_S ? 'ok' : s < LATE_S ? 'warn' : 'over'; }
  function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function hm(ts) { var d = new Date(ts || Date.now()); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function matches(o) {
    if (S.station === 'all') return true;
    return (o.lines || []).some(function (l) { return l.station === S.station; });
  }
  function stationIsReady(o) {
    if (S.station === 'all') return o.status === 'ready';
    var lines = (o.lines || []).filter(function (l) { return l.station === S.station; });
    return lines.length > 0 && lines.every(function (l) { return l.stationReady === true; });
  }
  function stationIsAccepted(o) {
    var lines = S.station === 'all'
      ? (o.lines || [])
      : (o.lines || []).filter(function (l) { return l.station === S.station; });
    return lines.length > 0 && lines.every(function (l) { return l.stationAccepted === true; });
  }
  function bucket(o) {
    if (o.status === 'ready' || stationIsReady(o)) return 'pass';
    return stationIsAccepted(o) || S.cooking[o.id] ? 'cook' : 'new';
  }
  function group(name) {
    return Object.keys(S.orders).map(function (k) { return S.orders[k]; })
      .filter(function (o) { return bucket(o) === name && matches(o); })
      .sort(function (a, b) { return (a.created_ts || 0) - (b.created_ts || 0); });
  }

  /* Le numéro que TOUT LE MONDE peut prononcer. C'est celui du serveur : le
     comptoir l'affiche aussi (kiwi-caisse.html · ticketNo), donc « bon 7 prêt »
     crié depuis le passe désigne bien le bon que le caissier a sous les yeux. */
  function serverInitials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    return ((parts[0][0] || '') + (parts.length > 1 ? (parts[parts.length - 1][0] || '') : '')).toUpperCase();
  }
  function ticketNo(o) {
    var n = String((o && o.number) || 0);
    if (o && o.channel === 'kiwi') {
      var employeePrefix = serverInitials(o.server);
      if (employeePrefix) return employeePrefix + '-' + n;
      return (o.mode === 'takeout' ? 'OPD-' : 'OP-') + n;
    }
    return n;
  }

  function whereChip(o) {
    if (o.mode === 'table' && o.table) return '<span class="chip table">' + T('chip.table') + ' ' + esc(o.table) + '</span>';
    if (o.mode === 'delivery') return '<span class="chip away">' + T('chip.delivery') + '</span>';
    return '<span class="chip away">' + T('chip.takeout') + '</span>';
  }

  function card(o, kind) {
    var el = elapsed(o), u = urgency(el);
    var items = (o.lines || []).map(function (l) {
      var off = S.station !== 'all' && l.station !== S.station;
      var note = String(l.note || '').trim();
      var visuals = (Array.isArray(l.visuals) ? l.visuals : []).filter(function (v) {
        return v && (v.name || v.label || v.cn);
      }).map(function (v) {
        return { emoji: v.emoji || v.e || '', name: v.name || v.label || v.cn };
      });
      var visualHtml = visuals.length ? '<span class="tk-visuals">' + visuals.map(function (v) {
        return '<span class="tk-visual">' + (v.emoji ? '<span class="tk-visual-emoji">' + esc(v.emoji) + '</span>' : '') + '<span>' + esc(v.name) + '</span></span>';
      }).join('') + '</span>' : '';
      var formulaTag = l.kind === 'formula-part'
        ? '<span class="tk-formula-tag">' + esc((l.formulaName ? l.formulaName + (l.slotLabel ? ' · ' + l.slotLabel : '') : (l.slotLabel || 'Formule'))) + '</span>'
        : '';
      return '<li class="' + (off ? 'off' : '') + '"><span class="tk-q">' + (l.qty || 1) + '×</span>'
        + '<span class="tk-n">' + formulaTag + esc(l.name) + visualHtml + (note ? '<span class="tk-note">' + esc(note) + '</span>' : '') + '</span></li>';
    }).join('');
    var act = kind === 'new'
      ? '<button class="tk-act act-accept" data-take="' + esc(o.id) + '">' + SVG.hand + T('act.take') + '</button>'
      : kind === 'cook'
        ? '<button class="tk-act act-ready" data-ready="' + esc(o.id) + '">' + SVG.check + T('act.ready') + '</button>'
        : (o.status === 'ready'
          ? '<button class="tk-act act-served" data-served="' + esc(o.id) + '">' + T('act.served') + '</button>'
          : '<button class="tk-act act-served" disabled>' + T('act.stationReady') + '</button>');
    var right = kind === 'pass'
      ? '<span class="tk-timer ok">' + SVG.check + hm(o.updated_ts) + '</span>'
      : '<span class="tk-timer ' + u + '">' + SVG.clock + '<span>' + mmss(el) + '</span></span>';

    var voidBanner = '';
    var voidLine = (o.lines || []).find(function (l) { return l && l.voidAlert; });
    if (voidLine && voidLine.voidAlert) {
      var va = voidLine.voidAlert;
      /* La RAISON est une clé persistée par la caisse : on traduit le
         libellé, jamais le jeton — une raison inconnue reste affichée telle
         quelle plutôt que d'être avalée. */
      var known = ['client_change', 'order_error', 'kitchen_waste', 'quality_return'];
      var reasonLabel = known.indexOf(va.reason) >= 0 ? T('void.' + va.reason)
        : (va.reason || T('void.other'));
      voidBanner = '<div class="tk-void-banner">'
        + '<div class="tk-void-header">' + SVG.warn + '<span>' + T('void.title') + ' : ' + (va.qty || 1) + '× ' + esc(voidLine.name) + ' (' + esc(reasonLabel) + ')</span></div>'
        + '<div class="tk-void-acts">'
        + '<button class="act-void-accept" data-void-ack="' + esc(o.id) + '" data-void-action="accept">' + T('void.accept') + '</button>'
        + '<button class="act-void-reject" data-void-ack="' + esc(o.id) + '" data-void-action="reject">' + T('void.reject') + '</button>'
        + '</div></div>';
    }

    return '<article class="tk ' + (kind === 'new' ? 'is-new' : kind === 'pass' ? 'pass' : '')
      + (u === 'over' && kind !== 'pass' ? ' is-late' : '') + '" data-tk="' + esc(o.id) + '">'
      + '<div class="tk-top"><span class="tk-no">' + ticketNo(o) + '</span>' + right + '</div>'
      + '<div class="tk-meta">' + whereChip(o)
      + (o.server ? '<span class="chip who">' + esc(o.server) + '</span>' : '') + '</div>'
      + '<ul class="tk-items">' + items + '</ul>' + voidBanner + act + '</article>';
  }

  function emptyBox(msg) {
    return '<div class="empty">' + SVG.empty + '<span>' + esc(msg) + '</span></div>';
  }

  function stationBar() {
    var list = S.stations;
    if (!list.length) return '';
    var count = function (id) {
      return Object.keys(S.orders).filter(function (k) {
        var o = S.orders[k];
        if (id === 'all') return o.status !== 'ready';
        var lines = (o.lines || []).filter(function (l) { return l.station === id; });
        return lines.length > 0 && !lines.every(function (l) { return l.stationReady === true; });
      }).length;
    };
    var btn = function (id, color, label) {
      return '<button class="st' + (S.station === id ? ' on' : '') + '" data-st="' + esc(id) + '">'
        + '<i style="background:' + esc(color) + '"></i><span>' + esc(label) + '</span>'
        + '<span class="ct">' + count(id) + '</span></button>';
    };
    /* Un seul poste ne se filtre pas : « Tous » et « Cuisine » montreraient
       exactement la même chose. On garde la barre pour le compteur. */
    return (list.length > 1 ? btn('all', '#0A0F0D', T('bar.all')) : '')
      + list.map(function (s) { return btn(s.id, s.color, s.name); }).join('');
  }

  function paint() {
    $('bar').innerHTML = stationBar();
    var n = group('new'), c = group('cook'), p = group('pass');
    $('n-new').textContent = n.length;
    $('n-cook').textContent = c.length;
    $('n-pass').textContent = p.length;
    $('s-new').innerHTML = n.length ? n.map(function (o) { return card(o, 'new'); }).join('')
      : emptyBox(T('empty.new'));
    $('s-cook').innerHTML = c.length ? c.map(function (o) { return card(o, 'cook'); }).join('')
      : emptyBox(T('empty.cook'));
    $('s-pass').innerHTML = p.length ? p.map(function (o) { return card(o, 'pass'); }).join('')
      : emptyBox(T('empty.pass'));
  }

  /* Les minuteurs seuls, sans reconstruire le DOM : repeindre une carte sous le
     doigt d'un cuisinier ferait rater le bump d'une seconde sur deux. */
  function tickTimers() {
    document.querySelectorAll('.tk[data-tk]').forEach(function (el) {
      var o = S.orders[el.dataset.tk];
      if (!o || o.status === 'ready') return;
      var t = el.querySelector('.tk-timer');
      if (!t) return;
      var s = elapsed(o), u = urgency(s);
      t.className = 'tk-timer ' + u;
      var v = t.querySelector('span');
      if (v) v.textContent = mmss(s);
      el.classList.toggle('is-late', u === 'over');
    });
    $('clock').textContent = hm(Date.now());
  }

  /* ── Les gestes du passe ─────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var voidAck = e.target.closest('[data-void-ack]');
    if (voidAck) {
      var vOrderId = voidAck.dataset.voidAck;
      var vAction = voidAck.dataset.voidAction;
      var vOrder = S.orders[vOrderId];
      if (vOrder && Array.isArray(vOrder.lines)) {
        var vLine = vOrder.lines.find(function (l) { return l && l.voidAlert; });
        if (vLine) {
          if (vAction === 'accept') {
            var vq = (vLine.voidAlert && vLine.voidAlert.qty) || 1;
            if (vLine.qty > vq) {
              vLine.qty -= vq;
              delete vLine.voidAlert;
            } else {
              vOrder.lines = vOrder.lines.filter(function (l) { return l !== vLine; });
            }
          } else {
            delete vLine.voidAlert;
            vLine.note = (vLine.note ? vLine.note + ' ' : '') + T('void.rejectNote');
          }
        }
      }
      paint();
      KiwiKitchenRelay.ackVoid(vOrderId, vAction);
      return;
    }

    var st = e.target.closest('[data-st]');
    if (st) { S.station = st.dataset.st; paint(); return; }

    var take = e.target.closest('[data-take]');
    if (take) {
      var takeId = take.dataset.take, takeOrder = S.orders[takeId];
      if (!takeOrder) return;
      var takeStation = S.station === 'all' ? '' : S.station;
      (takeOrder.lines || []).forEach(function (line) {
        if (!takeStation || line.station === takeStation) line.stationAccepted = true;
      });
      delete S.cooking[takeId];
      saveCooking(); paint();
      KiwiKitchenRelay.bump(takeId, 'cooking', takeStation);
      return;
    }
    var rdy = e.target.closest('[data-ready]');
    if (rdy) {
      var id = rdy.dataset.ready, o = S.orders[id];
      if (!o) return;
      /* Optimiste : la brigade ne doit jamais attendre le réseau, elle a les
         mains dans une poêle. Le prochain sondage tranchera avec la vérité du
         serveur si l'appel a échoué. */
      var station = S.station === 'all' ? '' : S.station;
      if (station) {
        (o.lines || []).forEach(function (line) {
          if (line.station === station) line.stationReady = true;
        });
        if ((o.lines || []).length && o.lines.every(function (line) { return line.stationReady === true; })) {
          o.status = 'ready';
          delete S.cooking[id];
        }
      } else {
        (o.lines || []).forEach(function (line) { line.stationReady = true; });
        o.status = 'ready';
        delete S.cooking[id];
      }
      o.updated_ts = Date.now();
      saveCooking(); paint();
      KiwiKitchenRelay.bump(id, 'ready', station);
      return;
    }
    var srv = e.target.closest('[data-served]');
    if (srv) {
      var sid = srv.dataset.served;
      delete S.orders[sid];
      paint();
      KiwiKitchenRelay.bump(sid, 'served');
      return;
    }
  });

  /* ── Confort d'un écran mural ────────────────────────────────────────────── */
  function paintSound() { $('sound').innerHTML = S.muted ? SVG.off : SVG.on; $('sound').classList.toggle('off', S.muted); }
  /* Le climat suit le système tant que personne n'a tranché ; la première
     pression fige le contraire de ce qui est affiché, et ça reste. Une cuisine
     n'a pas d'écran de réglages : le geste est le réglage. */
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function paintTheme() { $('theme').innerHTML = currentTheme() === 'dark' ? SVG.moon : SVG.sun; }
  function bindTools() {
    S.muted = ls(MUTE_KEY) === '1';
    paintSound();
    paintTheme();
    $('sound').addEventListener('click', function () {
      S.muted = !S.muted; put(MUTE_KEY, S.muted ? '1' : '0'); paintSound();
    });
    $('theme').addEventListener('click', function () {
      put('kiwiTheme', currentTheme() === 'dark' ? 'light' : 'dark');
      if (window.__kiwiApplyTheme) window.__kiwiApplyTheme();
      paintTheme();
    });
    $('lang').addEventListener('click', function () {
      var next = LANGS[(LANGS.indexOf(lang()) + 1) % LANGS.length];
      put(LANG_KEY, next);
      applyLang();
    });
    $('full').addEventListener('click', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (_) {}
    });
  }

  /* L'écran ne doit pas s'éteindre au milieu d'un service. Le verrou se perd
     quand l'onglet passe en arrière-plan — on le reprend au retour. */
  var lock = null;
  function keepAwake() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { keepAwake(); pull(); }
  });

  /* ── Démarrage ───────────────────────────────────────────────────────────── */
  var timer = null;
  function start() {
    if (!paired()) { $('pair').classList.add('on'); $('screen').hidden = true; drawPad(); return; }
    $('pair').classList.remove('on');
    $('screen').hidden = false;
    var v = venue();
    if (v && v.name) $('store-name').textContent = v.name;
    loadCooking();
    loadStations();
    paint();
    tickTimers();
    keepAwake();
    pull();
    if (timer) clearInterval(timer);
    timer = setInterval(pull, POLL_MS);
  }

  function boot() {
    bindTools();
    applyLang();
    setInterval(tickTimers, 1000);
    start();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
