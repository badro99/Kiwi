name = "kiwi-morning-push"
main = "index.js"
compatibility_date = "2026-08-27"

# Cloudflare cron is UTC only. Morocco is UTC+1 all year except Ramadan (UTC+0),
# so 05:30 in Casablanca is 04:30 UTC normally and 05:30 UTC during Ramadan.
# Both are declared; index.js acts only when Casablanca time is 05:30 to 05:59,
# so exactly one of them fires and never before the 05:00 business-day cutoff.
[triggers]
crons = ["30 4 * * *", "30 5 * * *"]

[observability]
enabled = true

[vars]
MORNING_URL = "https://kiwi-os.com/api/push/morning"

# Secret, never here:  wrangler secret put MORNING_PUSH_SECRET
