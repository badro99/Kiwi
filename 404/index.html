<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Kiwi</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/legacy-faces.css?v=1">
<style>
  @font-face { font-family: "Inter Tight"; src: url("/assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
  :root { --paper: #F7F5F0; --ink: #0A0F0D; --atlas: #0B6E4F; --riad: #053B2C; --mint: #7DF2B0; color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: var(--paper); color: var(--ink);
    font: 400 17px/1.55 "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 34rem; }
  .logo { display: inline-block; margin-bottom: 40px; }
  .logo img { height: 34px; width: auto; display: block; }
  .code { font: 600 13px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .12em; color: var(--atlas); margin: 0 0 14px; }
  h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.08; letter-spacing: -.03em; font-weight: 600; margin: 0 0 14px; }
  p { margin: 0 0 28px; opacity: .74; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 48px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
    font-weight: 600; font-size: 15px; text-decoration: none; }
  .btn-primary { background: var(--riad); color: var(--paper); }
  .btn-ghost { border: 1px solid rgba(10, 15, 13, .18); color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--atlas); outline-offset: 3px; }
  .other { border-top: 1px solid rgba(10, 15, 13, .12); padding-top: 22px; display: grid; gap: 14px; font-size: 15px; }
  .other a { color: var(--atlas); font-weight: 600; }
  .other p { margin: 0; opacity: .8; }
  [lang="ar"] { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    body { background: var(--ink); color: var(--paper); }
    .code, .other a { color: var(--mint); }
    .btn-primary { background: var(--mint); color: var(--ink); }
    .btn-ghost { border-color: rgba(247, 245, 240, .22); color: var(--paper); }
    .other { border-top-color: rgba(247, 245, 240, .14); }
  }
</style>
</head>
<body>
<main>
  <a class="logo" href="/fr/" aria-label="Kiwi · accueil"><picture><source media="(prefers-color-scheme: dark)" srcset="/images/kiwi-logo.svg"><img src="/images/kiwi-logo-ink.svg" alt="Kiwi" width="96" height="34"></picture></a>
  <p class="code">ERREUR 404</p>
  <h1>Cette page n’existe pas, ou plus.</h1>
  <p>Le lien est peut-être incomplet ou la page a changé d’adresse. Tout le reste de Kiwi est toujours là.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/fr/">Retour à l’accueil</a>
    <a class="btn btn-ghost" href="/fr/guides/">Les guides</a>
    <a class="btn btn-ghost" href="/support">Assistance</a>
  </div>
  <div class="other">
    <p lang="en">This page does not exist. <a href="/en/">Go to the Kiwi homepage</a></p>
    <p lang="ar" dir="rtl">هذه الصفحة غير موجودة. <a href="/ar/">العودة إلى الصفحة الرئيسية</a></p>
  </div>
</main>
</body>
</html>
