<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="kiwi-sprite" content="assets/icons/material/sprite.kit.svg?v=2">
<title>Kiwi Kit</title>
<link rel="stylesheet" href="assets/kit/tokens-2027.css?v=2">
<link rel="stylesheet" href="assets/kit/kit.css?v=67">
<style>
  /* The gallery's own page: tokens only, no component styling. */
  body { margin: 0; background-color: var(--k-bg); color: var(--k-ink-1); font-family: var(--k-font); font-size: var(--k-fs-body); line-height: var(--k-lh-body); }
  .g-top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; background-color: var(--k-bg); box-shadow: inset 0 -1px 0 var(--k-line); }
  .g-top h1 { margin: 0; flex: 1; font-size: var(--k-fs-heading); font-weight: var(--k-fw-heading); }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
  section { min-width: 0; }
  section > h2 { margin: 0 0 12px; font-size: var(--k-fs-heading); font-weight: var(--k-fw-heading); }
  section > p { margin: 0 0 12px; color: var(--k-ink-2); font-size: var(--k-fs-footnote); }
  .g-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .g-card { padding: 16px; border-radius: var(--k-r-3); background-color: var(--k-surface-1); }
  .g-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .g-btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background-color: var(--k-surface-2); color: var(--k-ink-1); font: inherit; font-size: var(--k-fs-callout); }
  .g-tall { height: 640px; }
  .g-kds { display: grid; grid-template-columns: 384px minmax(0, 1fr) 272px; gap: 16px; height: 980px; padding: 16px; border-radius: var(--k-r-3); background-color: var(--k-bg); overflow-x: auto; }
  #log { margin: 0; padding-inline-start: 20px; color: var(--k-ink-2); font-size: var(--k-fs-footnote); font-family: var(--k-font); }
</style>
</head>
<body>
<header class="g-top">
  <h1>Kiwi Kit</h1>
  <k-segmented id="g-theme" size="compact" label="Theme"></k-segmented>
  <k-segmented id="g-lang" size="compact" label="Language"></k-segmented>
</header>
<main>
  <section id="s-buttons">
    <h2>Buttons</h2>
    <div class="g-row">
      <k-button variant="primary" size="L" label="Charge 230.00 MAD"></k-button>
      <k-button variant="secondary" label="Split"></k-button>
      <k-button variant="tonal-danger" label="Void item"></k-button>
      <k-button variant="danger" label="Cancel sale"></k-button>
      <k-button variant="plain" label="Add dish costs"></k-button>
      <k-button variant="icon" icon="print" label="Print bill"></k-button>
      <k-button variant="primary-icon" icon="send" label="Send"></k-button>
      <k-button variant="secondary" size="S" label="Edit options"></k-button>
      <k-button variant="primary" label="Confirm cash payment" disabled reason="Enter at least 230.00 MAD."></k-button>
      <k-button variant="secondary" label="Sending" loading></k-button>
    </div>
  </section>

  <section id="s-small">
    <h2>Badge, avatar, skeleton, spinner</h2>
    <div class="g-row">
      <k-badge count="3"></k-badge><k-badge count="140"></k-badge>
      <k-avatar name="Salma Bennani"></k-avatar><k-avatar name="Karim Alaoui" size="56"></k-avatar>
      <k-spinner></k-spinner>
      <k-icon name="receipt_long" size="24"></k-icon>
      <span>Revenue <k-figure id="fig"></k-figure></span>
    </div>
    <k-skeleton lines="3"></k-skeleton>
  </section>

  <section id="s-controls">
    <h2>Controls</h2>
    <div class="g-cols">
      <div class="g-card"><k-switch label="Morning briefing"></k-switch><k-switch label="Order sound" checked></k-switch></div>
      <div class="g-card"><k-stepper value="2" min="0" max="5" label="Harira"></k-stepper></div>
      <div class="g-card"><k-chips id="chips-single" value="all" label="Payment"></k-chips><k-chips id="chips-multi" mode="multi" label="Segments"></k-chips></div>
      <div class="g-card"><k-field label="Name" helper="As it shows on the receipt"></k-field><k-field label="Search" search></k-field><k-field label="E-mail" error="Enter a valid address"></k-field></div>
    </div>
  </section>

  <section id="s-feedback">
    <h2>Banners, empty states, toasts</h2>
    <div class="g-cols">
      <k-banner tone="warning" message="Not saved yet. Kiwi keeps trying in the background."></k-banner>
      <k-banner tone="danger" message="Couldn't load. Try again." action-label="Try again"></k-banner>
      <k-banner tone="info" message="Printing through the counter computer." dismissible></k-banner>
      <k-empty kind="first-use" icon="receipt_long" heading="No orders yet" body="Sales show here as they happen." action-label="Open the till"></k-empty>
      <k-empty kind="offline"></k-empty>
    </div>
    <div class="g-row"><button class="g-btn" data-g="toast" type="button">Toast with Undo</button><button class="g-btn" data-g="toast-info" type="button">Toast</button></div>
  </section>

  <section id="s-list">
    <h2>List and page header</h2>
    <div class="g-cols">
      <div><k-page-header id="hdr" kind="large" heading="Customers" subtitle="214 known" demo></k-page-header><k-list id="list" label="Rows"></k-list></div>
    </div>
  </section>

  <section id="s-nav">
    <h2>Navigation</h2>
    <k-segmented id="seg-range" label="Range"></k-segmented>
    <k-segmented id="seg-cats" label="Categories"></k-segmented>
    <div class="g-cols">
      <k-tabbar id="tabbar" value="home" label="Main"></k-tabbar>
      <div class="g-row" style="align-items:stretch;height:420px"><k-rail id="rail" value="home" label="Till"></k-rail><k-sidebar id="sidebar" value="orders" label="Dashboard"></k-sidebar></div>
    </div>
    <div class="g-cols"><k-date-button label="Today · 12 October"></k-date-button><k-range-picker month="2026-10" start="2026-10-06" end="2026-10-12" today="2026-10-12"></k-range-picker></div>
  </section>

  <section id="s-overlays">
    <h2>Sheet, confirm, popover, tooltip</h2>
    <div class="g-row">
      <button class="g-btn" data-g="sheet" type="button">Sheet</button>
      <button class="g-btn" data-g="confirm" type="button">Confirm</button>
      <button class="g-btn" data-g="popover" type="button">Popover</button>
    </div>
    <k-sheet id="sheet" heading="Compare with" detent="medium"><k-list id="sheet-list" label="Compare with"></k-list></k-sheet>
    <k-sheet id="confirm" heading="Void item" confirm detent="medium"><p>The kitchen sees the line struck through.</p><k-button slot="footer" variant="danger" size="L" full label="Void item"></k-button></k-sheet>
    <k-popover id="popover" heading="Tip"><p>Popovers never hold a keypad.</p></k-popover>
  </section>

  <section id="s-pin">
    <h2>PIN pad</h2>
    <div class="g-cols">
      <k-pin-pad id="pin" identity="Amira Cafe (demo)" heading="Dashboard locked" face-id></k-pin-pad>
      <div class="g-row" style="align-content:start">
        <button class="g-btn" data-g="pin-wrong" type="button">Wrong</button>
        <button class="g-btn" data-g="pin-offline" type="button">Offline</button>
        <button class="g-btn" data-g="pin-gate" type="button">Needs connection</button>
        <button class="g-btn" data-g="pin-ungate" type="button">Connection back</button>
        <button class="g-btn" data-g="pin-ok" type="button">Hello</button>
        <button class="g-btn" data-g="pin-reset" type="button">Reset</button>
      </div>
    </div>
  </section>

  <section id="s-dash">
    <h2>Figures</h2>
    <k-compare id="compare" delta="-1127" delta-kind="money" polarity="up-good" value="yesterday"></k-compare>
    <k-chart id="chart"></k-chart>
    <k-kpi-grid id="kpi"></k-kpi-grid>
  </section>

  <section id="s-till">
    <h2>Till</h2>
    <div class="g-cols">
      <div class="g-tall" style="overflow:auto"><k-menu-grid id="menu"></k-menu-grid></div>
      <div class="g-tall"><k-bill id="bill"></k-bill></div>
    </div>
    <div class="g-cols">
      <div class="g-card"><k-pay id="pay"></k-pay></div>
      <div class="g-card"><k-options id="options"></k-options></div>
      <div class="g-card"><k-keypad label="Amount"></k-keypad></div>
    </div>
    <div class="g-card"><k-cash-count id="count"></k-cash-count></div>
    <div class="g-card"><k-cash-count id="count-open" mode="open"></k-cash-count></div>
    <div class="g-cols">
      <div class="g-card"><k-split id="split"></k-split></div>
      <div class="g-card"><k-discount id="discount"></k-discount></div>
    </div>
    <div class="g-cols">
      <k-bill-bar count="3" total="230"></k-bill-bar>
      <div class="g-card"><k-code-display id="code-att" kind="attendance" state="shown" code="482913" time="17:44"></k-code-display><div class="g-row"><button class="g-btn" data-g="code-loading" type="button">Loading</button><button class="g-btn" data-g="code-new" type="button">Changed elsewhere</button></div></div>
      <div class="g-card"><k-code-display kind="printer" state="expired" code="310577" time="17:30"></k-code-display></div>
      <div class="g-card"><k-code-display kind="attendance" state="failed"></k-code-display></div>
    </div>
  </section>

  <section id="s-kds">
    <h2>Kitchen</h2>
    <k-segmented id="seg-kds" size="kitchen" label="Stations"></k-segmented>
    <div class="g-kds">
      <k-lane id="lane-new" lane="new" columns="1"></k-lane>
      <k-lane id="lane-prep" lane="preparing" columns="3"></k-lane>
      <k-lane id="lane-ready" lane="ready" columns="1"></k-lane>
    </div>
  </section>

  <section id="s-log">
    <h2>Actions reported</h2>
    <ol id="log"></ol>
  </section>
</main>

<script src="assets/kit/strings/kit.en.js?v=2"></script>
<script src="assets/kit/strings/kit.fr.js?v=2"></script>
<script src="assets/kit/strings/kit.ar.js?v=2"></script>
<script src="assets/kit/strings/dashboard.en.js?v=2"></script>
<script src="assets/kit/strings/dashboard.fr.js?v=2"></script>
<script src="assets/kit/strings/dashboard.ar.js?v=2"></script>
<script src="assets/kit/strings/till.en.js?v=14"></script>
<script src="assets/kit/strings/till.fr.js?v=14"></script>
<script src="assets/kit/strings/till.ar.js?v=14"></script>
<script src="assets/kit/strings/kds.en.js?v=3"></script>
<script src="assets/kit/strings/kds.fr.js?v=3"></script>
<script src="assets/kit/strings/kds.ar.js?v=3"></script>
<script src="assets/kit/strings.js?v=2"></script>
<script src="assets/kit/haptics.js?v=7"></script>
<script src="assets/kit/format.js?v=3"></script>
<script src="assets/kit/business-day.js?v=4"></script>
<script src="assets/kit/ledger.js?v=4"></script>
<script src="assets/kit/motion.js?v=1"></script>
<script src="assets/kit/core.js?v=2"></script>
<script src="assets/kit/controls/button.js?v=1"></script>
<script src="assets/kit/controls/stepper.js?v=1"></script>
<script src="assets/kit/controls/switch.js?v=1"></script>
<script src="assets/kit/controls/chip.js?v=1"></script>
<script src="assets/kit/controls/keypad.js?v=3"></script>
<script src="assets/kit/lens.js?v=1"></script>
<script src="assets/kit/actions.js?v=1"></script>
<script src="assets/kit/elements.js?v=4"></script>
<script src="assets/kit/nav.js?v=9"></script>
<script src="assets/kit/overlays.js?v=2"></script>
<script src="assets/kit/pin.js?v=5"></script>
<script src="assets/kit/dashboard.js?v=8"></script>
<script src="assets/kit/till.js?v=30"></script>
<script src="assets/kit/kds.js?v=9"></script>
<script src="assets/kit/gallery.js?v=4"></script>
</body>
</html>
