[package]
name = "kiwi-printer-bridge"
version = "1.5.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"
getrandom = "0.3"
if-addrs = "0.13"
socket2 = "0.5"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
