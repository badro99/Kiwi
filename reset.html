<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Kiwi · Nouveau mot de passe</title>
<!-- La page où atterrit le lien envoyé depuis la console opérateur
     (functions/api/admin/reset.js). Elle n'affiche AUCUNE adresse e-mail, et un
     lien périmé, déjà utilisé ou inventé donne le même message : la page ne peut
     donc pas servir à savoir si une adresse est cliente de Kiwi.

     Autonome, sans dépendance : elle doit fonctionner pour quelqu'un qui n'a pas
     de session, donc avant tout ce que le reste de l'app charge.

     La police est la SEULE dépendance externe, et elle est volontaire : la pile
     commençait par -apple-system, donc « Inter Tight » n'était jamais atteinte et
     la page rendait en San Francisco — la voix d'iOS, pas la nôtre. Le lien est
     posé avant la feuille de style, et la pile système reste derrière : si
     Google Fonts ne répond pas, la page s'affiche, en système, tout de suite. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --atlas:#0B6E4F; --riad:#053B2C; --mint:#7DF2B0;
    --paper:#F7F5F0; --ink:#0A0F0D; --line:#e4e0d7; --muted:#5d6b63; --surface:#FFFDFA;
    --warn:#b0402f;
  }
  em,i,cite,dfn,var{font-style:normal}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:16px/1.55 "Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:-.005em;
    /* min-height:100% ne centrait rien : un pourcentage se mesure sur la
       hauteur du parent, et <html> est en hauteur auto. La carte restait donc
       collée en haut, avec un vide sous elle. 100dvh mesure le viewport
       réellement visible (barre d'adresse mobile comprise), avec 100vh en
       repli pour les navigateurs qui ne connaissent pas l'unité. */
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line);
        border-radius:14px; padding:30px 28px; box-shadow:0 1px 2px rgba(10,15,13,.05)}
  .mark{display:block; margin:0 0 8px}
  .mark img{display:block; width:auto; height:28px}
  h1{font-size:17px; font-weight:600; margin:0 0 6px; letter-spacing:-.015em; line-height:1.25}
  p{margin:0 0 18px; color:var(--muted); font-size:13.5px}
  label{display:block; font-size:11px; font-weight:500; letter-spacing:0;
        color:var(--muted); margin:0 0 6px}
  input{width:100%; font:inherit; font-size:15px; padding:11px 13px; border:1px solid var(--line);
        border-radius:10px; background:var(--paper); color:var(--ink); margin:0 0 14px;
        transition:border-color .15s cubic-bezier(0,0,.2,1)}
  input:focus{outline:none; border-color:var(--atlas); box-shadow:0 0 0 3px rgba(11,110,79,.12)}
  button{width:100%; font:inherit; font-size:15px; font-weight:600; border:0; border-radius:10px;
         padding:12px 16px; cursor:pointer; background:var(--atlas); color:#eafff4;
         transition:background .15s cubic-bezier(0,0,.2,1)}
  button:hover:not(:disabled){background:#0e8560}
  button:focus-visible,.back:focus-visible{outline:2px solid var(--atlas); outline-offset:2px}
  button:disabled{opacity:.5; cursor:default}
  .msg{font-size:13px; margin:12px 0 0; min-height:1.2em}
  .msg.bad{color:var(--warn)}
  .msg.ok{color:var(--atlas)}
  .back{display:inline-flex; align-items:center; min-height:44px; margin-top:8px; color:var(--atlas); font-size:13.5px; text-decoration:none; font-weight:500}
  .btn{display:flex; align-items:center; justify-content:center; min-height:44px; width:100%; border-radius:10px; padding:12px 16px; background:var(--atlas); color:#eafff4; font-size:15px; font-weight:600; text-decoration:none; margin:0 0 4px}
  .btn:focus-visible{outline:2px solid var(--atlas); outline-offset:2px}
  .hint{font-size:12px; color:var(--muted); margin:10px 0 0}
  @media (prefers-color-scheme:dark){
    :root{--paper:#0d1411; --ink:#e8efe9; --surface:#151b18; --line:#26302b; --muted:#93a89c}
    .mark{color:#cfeeda}
    .back{color:var(--mint)}
    /* --atlas sur un fond sombre, c'est du vert sur du noir : illisible en
       texte, correct en surface. On ne touche pas au jeton de marque, on
       n'éclaircit que les rôles d'encre. */
    button{background:var(--atlas)}
    button:hover:not(:disabled){background:#0e8560}
    .btn:focus-visible{outline-color:var(--mint)}
    input:focus{border-color:var(--mint); box-shadow:0 0 0 3px rgba(125,242,176,.14)}
    .msg.ok{color:var(--mint)}
    .msg.bad{color:#ff9d8a}
    button:focus-visible,.back:focus-visible{outline-color:var(--mint)}
  }
</style>
<!-- Design 2027, stage 6 (spec §18.8, R1 to R7): forgot and reset password on
     the kit, behind the access flag only (localStorage kiwiSkin2027:access = '1',
     or ?skin=2027 for one load). Off, nothing below loads and the shipped flow
     draws as before. -->
<script>
  (function () {
    var on = false;
    try { on = /[?&]skin=2027(?:&|$)/.test(location.search) || localStorage.getItem('kiwiSkin2027:access') === '1'; } catch (_) { on = false; }
    if (!on) return;
    document.documentElement.setAttribute('data-skin-2027', 'access');
    var js = function (src) { return '<' + 'script defer src="' + src + '"></' + 'script>'; };
    document.write(
      '<meta name="kiwi-sprite" content="assets/icons/material/sprite.access.svg?v=1">' +
      '<link rel="stylesheet" href="assets/kit/tokens-2027.css?v=1">' +
      '<link rel="stylesheet" href="assets/kit/kit.css?v=27">' +
      js("assets/kit/strings/kit.fr.js?v=2") +
      js("assets/kit/strings/kit.en.js?v=2") +
      js("assets/kit/strings/kit.ar.js?v=2") +
      js("assets/kit/strings/onboarding.fr.js?v=1") +
      js("assets/kit/strings/onboarding.en.js?v=1") +
      js("assets/kit/strings/onboarding.ar.js?v=1") +
      js("assets/kit/strings.js?v=2") +
      js("assets/kit/format.js?v=1") +
      js("assets/kit/core.js?v=1") +
      js("assets/kit/controls/button.js?v=1") +
      js("assets/kit/controls/chip.js?v=1") +
      js("assets/kit/controls/stepper.js?v=1") +
      js("assets/kit/controls/switch.js?v=1") +
      js("assets/kit/elements.js?v=1") +
      js("assets/kit/access-reset.js?v=1")
    );
  })();
</script>
</head>
<body>
  <main class="card">
    <picture class="mark"><source media="(prefers-color-scheme: dark)" srcset="assets/kiwi-newlogo-inverse.svg"><img src="assets/kiwi-newlogo.svg" alt="Kiwi"></picture>
    <div id="view"></div>
  </main>
<script>
(function(){
  'use strict';
  var view = document.getElementById('view');

  /* Langue : même règle que la porte de compte (functions/_middleware.js) :
     ?lang=, puis la langue mémorisée, puis celle du navigateur, puis le français. */
  var lang = 'fr';
  try {
    var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
    var saved = '';
    try { saved = (localStorage.getItem('kiwiLang') || '').toLowerCase(); } catch(_){}
    var nav = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().split('-')[0];
    [q, saved, nav].some(function(c){ if (c === 'fr' || c === 'en' || c === 'ar') { lang = c; return true; } return false; });
  } catch(_){}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  /* Behind the access flag, assets/kit/access-reset.js draws the flow (§18.8);
     the language above is the one it reads. */
  if (document.documentElement.getAttribute('data-skin-2027') === 'access') return;

  var COPY = {
    fr: {
      title: 'Kiwi · Nouveau mot de passe',
      checking: 'Vérification du lien…',
      deadTitle: 'Ce lien n’est plus valable',
      deadBody: 'Un lien de réinitialisation expire au bout d’une heure et ne fonctionne qu’une seule fois.',
      again: 'Recevoir un nouveau lien',
      back: 'Retour à la connexion ›',
      reqTitle: 'Mot de passe oublié',
      reqBody: 'Saisissez l’adresse e-mail de votre compte. Nous vous enverrons un lien pour choisir un nouveau mot de passe.',
      email: 'E-mail', emailPh: 'vous@exemple.ma',
      send: 'Envoyer le lien', sending: 'Envoi…',
      badEmail: 'Saisissez une adresse e-mail valide.',
      tooMany: 'Trop de demandes. Réessayez dans quelques minutes.',
      netBad: 'Réseau indisponible. Réessayez.',
      unavailable: 'Service momentanément indisponible. Réessayez dans un instant.',
      sentTitle: 'Vérifiez votre boîte mail',
      sentBody: 'Si un compte Kiwi existe pour cette adresse, un lien de réinitialisation vient de lui être envoyé. Il est valable une heure et ne fonctionne qu’une fois. Pensez à regarder dans les courriers indésirables.',
      noMailTitle: 'Contactez-nous pour réinitialiser',
      noMailBody: 'L’envoi automatique par e-mail n’est pas encore actif. Écrivez-nous ou appelez-nous (WhatsApp compris) : nous envoyons le lien à l’adresse e-mail de votre compte, et uniquement à celle-ci.',
      noMailCta: 'Contacter le support',
      call: 'Appeler le +212 6 24 49 51 59',
      formTitle: 'Choisissez un nouveau mot de passe',
      formBody: 'Dix caractères minimum. Il remplacera l’ancien immédiatement.',
      p1: 'Nouveau mot de passe', p2: 'Confirmez',
      save: 'Enregistrer', saving: 'Enregistrement…',
      short: 'Dix caractères minimum.', differ: 'Les deux saisies diffèrent.',
      weakCommon: 'Ce mot de passe est trop courant.', weakPersonal: 'Évitez votre e-mail ou le nom de votre commerce.', weakLong: 'Mot de passe trop long.',
      saveFail: 'Enregistrement impossible pour le moment. Réessayez dans un instant.',
      doneTitle: 'Mot de passe enregistré', doneBody: 'Vous êtes connecté. Bonne journée.', open: 'Ouvrir mon tableau de bord'
    },
    en: {
      title: 'Kiwi · New password',
      checking: 'Checking the link…',
      deadTitle: 'This link is no longer valid',
      deadBody: 'A reset link expires after one hour and works only once.',
      again: 'Get a new link',
      back: 'Back to sign in ›',
      reqTitle: 'Forgot your password?',
      reqBody: 'Enter the email address of your account. We will send you a link to choose a new password.',
      email: 'Email', emailPh: 'you@example.com',
      send: 'Send the link', sending: 'Sending…',
      badEmail: 'Enter a valid email address.',
      tooMany: 'Too many requests. Try again in a few minutes.',
      netBad: 'Network unavailable. Please try again.',
      unavailable: 'Service temporarily unavailable. Please try again shortly.',
      sentTitle: 'Check your inbox',
      sentBody: 'If a Kiwi account exists for this address, a reset link has just been sent to it. It is valid for one hour and works only once. Check your spam folder too.',
      noMailTitle: 'Contact us to reset it',
      noMailBody: 'Automatic email sending is not active yet. Write to us or call us (WhatsApp works too) and we will send the link to your account email address, and only to that one.',
      noMailCta: 'Contact support',
      call: 'Call +212 6 24 49 51 59',
      formTitle: 'Choose a new password',
      formBody: 'At least ten characters. It replaces the old one immediately.',
      p1: 'New password', p2: 'Confirm',
      save: 'Save', saving: 'Saving…',
      short: 'At least ten characters.', differ: 'The two entries differ.',
      weakCommon: 'This password is too common.', weakPersonal: 'Avoid your email or business name.', weakLong: 'Password is too long.',
      saveFail: 'Could not save right now. Please try again shortly.',
      doneTitle: 'Password saved', doneBody: 'You are signed in. Have a good day.', open: 'Open my dashboard'
    },
    ar: {
      title: 'Kiwi · كلمة مرور جديدة',
      checking: 'جارٍ التحقق من الرابط…',
      deadTitle: 'هذا الرابط لم يعد صالحاً',
      deadBody: 'ينتهي رابط إعادة التعيين بعد ساعة واحدة ويعمل مرة واحدة فقط.',
      again: 'الحصول على رابط جديد',
      back: 'العودة إلى تسجيل الدخول ›',
      reqTitle: 'نسيت كلمة المرور؟',
      reqBody: 'أدخل البريد الإلكتروني لحسابك. سنرسل إليك رابطاً لاختيار كلمة مرور جديدة.',
      email: 'البريد الإلكتروني', emailPh: 'name@example.com',
      send: 'إرسال الرابط', sending: 'جارٍ الإرسال…',
      badEmail: 'أدخل بريداً إلكترونياً صحيحاً.',
      tooMany: 'طلبات كثيرة. حاول مرة أخرى بعد بضع دقائق.',
      netBad: 'تعذر الاتصال بالشبكة. حاول مرة أخرى.',
      unavailable: 'الخدمة غير متاحة مؤقتاً. حاول مرة أخرى بعد قليل.',
      sentTitle: 'تحقق من بريدك',
      sentBody: 'إذا كان هناك حساب Kiwi بهذا البريد، فقد أُرسل إليه رابط إعادة التعيين. الرابط صالح لمدة ساعة ويعمل مرة واحدة فقط. تحقق أيضاً من البريد غير الهام.',
      noMailTitle: 'تواصل معنا لإعادة التعيين',
      noMailBody: 'الإرسال التلقائي بالبريد غير مفعّل بعد. راسلنا أو اتصل بنا (يمكنك استعمال واتساب)، وسنرسل الرابط إلى بريد حسابك فقط.',
      noMailCta: 'التواصل مع الدعم',
      call: 'اتصل على +212 6 24 49 51 59',
      formTitle: 'اختر كلمة مرور جديدة',
      formBody: 'عشرة أحرف على الأقل. ستحل محل القديمة فوراً.',
      p1: 'كلمة المرور الجديدة', p2: 'تأكيد كلمة المرور',
      save: 'حفظ', saving: 'جارٍ الحفظ…',
      short: 'عشرة أحرف على الأقل.', differ: 'الإدخالان غير متطابقين.',
      weakCommon: 'كلمة المرور هذه شائعة جداً.', weakPersonal: 'تجنب بريدك الإلكتروني أو اسم نشاطك.', weakLong: 'كلمة المرور طويلة جداً.',
      saveFail: 'تعذر الحفظ حالياً. حاول مرة أخرى بعد قليل.',
      doneTitle: 'تم حفظ كلمة المرور', doneBody: 'تم تسجيل دخولك. نتمنى لك يوماً سعيداً.', open: 'فتح لوحة التحكم'
    }
  };
  function tr(k){ return (COPY[lang] && COPY[lang][k]) || COPY.fr[k] || k; }
  document.title = tr('title');

  function h(tag, props){
    var n = document.createElement(tag);
    if (props) for (var k in props){
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (props[k] != null && props[k] !== false) n.setAttribute(k, props[k]);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null || c === false) continue;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }
  function clear(){ while (view.firstChild) view.removeChild(view.firstChild); }
  function backLink(){ return h('a', { class:'back', href:'/dashboard?lang=' + lang }, tr('back')); }

  var token = '';
  try { token = new URLSearchParams(location.search).get('token') || ''; } catch(_){}

  /* Un seul écran d'échec pour tous les cas : expiré, déjà utilisé, inventé.
     Le serveur ne les distingue pas non plus (functions/auth/reset.js) : la
     précision serait un oracle, pas un service. De là, on peut demander un
     nouveau lien soi-même. */
  function dead(){
    clear();
    view.appendChild(h('h1', { text:tr('deadTitle') }));
    view.appendChild(h('p', { text:tr('deadBody') }));
    view.appendChild(h('button', { type:'button', onClick:request }, tr('again')));
    view.appendChild(backLink());
  }

  function done(){
    clear();
    view.appendChild(h('h1', { text:tr('doneTitle') }));
    view.appendChild(h('p', { text:tr('doneBody') }));
    view.appendChild(h('button', { onClick:function(){ location.href = '/dashboard.html'; } }, tr('open')));
  }

  /* Demande de lien (« mot de passe oublié »). La réponse du serveur est la même
     pour une adresse connue et inconnue (functions/auth/forgot.js) : cette page
     n'affiche donc jamais autre chose que « si un compte existe… ». Le champ
     `mail` dit seulement si Kiwi sait envoyer des e-mails : sinon on le dit et on
     renvoie vers le support, au lieu de promettre un courrier qui ne part pas. */
  function sent(){
    clear();
    view.appendChild(h('h1', { text:tr('sentTitle') }));
    view.appendChild(h('p', { text:tr('sentBody') }));
    view.appendChild(backLink());
  }
  function noMail(){
    clear();
    view.appendChild(h('h1', { text:tr('noMailTitle') }));
    view.appendChild(h('p', { text:tr('noMailBody') }));
    view.appendChild(h('a', { class:'btn', href:'/support.html#mot-de-passe-oublie' }, tr('noMailCta')));
    view.appendChild(h('a', { class:'back', href:'tel:+212624495159' }, tr('call')));
    view.appendChild(h('br'));
    view.appendChild(backLink());
  }
  function request(){
    clear();
    view.appendChild(h('h1', { text:tr('reqTitle') }));
    view.appendChild(h('p', { text:tr('reqBody') }));
    var em = h('input', { type:'email', id:'fe', autocomplete:'email', inputmode:'email', placeholder:tr('emailPh') });
    var msg = h('p', { class:'msg', role:'alert' });
    var btn = h('button', { type:'submit' }, tr('send'));
    var f = h('form', { novalidate:'novalidate', onSubmit:function(e){
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      var v = em.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ msg.className = 'msg bad'; msg.textContent = tr('badEmail'); em.focus(); return; }
      btn.disabled = true; btn.textContent = tr('sending');
      fetch('/auth/forgot', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ email: v }),
      }).then(function(r){ return r.json().then(function(j){ return { status:r.status, j:j }; }, function(){ return { status:r.status, j:{} }; }); })
        .then(function(res){
          if (res.status === 200 && res.j && res.j.ok) { if (res.j.mail) sent(); else noMail(); return; }
          btn.disabled = false; btn.textContent = tr('send');
          msg.className = 'msg bad';
          msg.textContent = res.status === 429 ? tr('tooMany')
                          : res.status === 400 ? tr('badEmail')
                          : tr('unavailable');
        })
        .catch(function(){
          btn.disabled = false; btn.textContent = tr('send');
          msg.className = 'msg bad'; msg.textContent = tr('netBad');
        });
    } },
      h('label', { for:'fe' }, tr('email')), em, btn, msg);
    view.appendChild(f);
    view.appendChild(backLink());
    setTimeout(function(){ try { em.focus(); } catch(_){} }, 60);
  }

  function form(){
    clear();
    view.appendChild(h('h1', { text:tr('formTitle') }));
    view.appendChild(h('p', { text:tr('formBody') }));

    var p1 = h('input', { type:'password', id:'p1', autocomplete:'new-password', placeholder:'••••••••' });
    var p2 = h('input', { type:'password', id:'p2', autocomplete:'new-password', placeholder:'••••••••' });
    var msg = h('p', { class:'msg', role:'alert' });
    var btn = h('button', { type:'submit' }, tr('save'));

    var f = h('form', { onSubmit:function(e){
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      var a = p1.value, b = p2.value;
      if (a.length < 10){ msg.className = 'msg bad'; msg.textContent = tr('short'); return; }
      if (a !== b){ msg.className = 'msg bad'; msg.textContent = tr('differ'); return; }
      btn.disabled = true; btn.textContent = tr('saving');
      fetch('/auth/reset', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ token: token, password: a }),
      }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){
          if (res.ok && res.j && res.j.ok) { done(); return; }
          var err = (res.j && res.j.error) || '';
          if (err === 'invalid'){ dead(); return; }
          /* Mot de passe pas enregistré ET lien pas rendu : seul un nouveau mail aide. */
          if (err === 'update-failed' && !(res.j && res.j.retry)){ dead(); return; }
          btn.disabled = false; btn.textContent = tr('save');
          msg.className = 'msg bad';
          var why = res.j && res.j.reason;
          msg.textContent = err === 'weak'
            ? (why === 'common' ? tr('weakCommon') : why === 'personal' ? tr('weakPersonal') : why === 'long' ? tr('weakLong') : tr('short'))
            : tr('saveFail');
        })
        .catch(function(){
          btn.disabled = false; btn.textContent = tr('save');
          msg.className = 'msg bad'; msg.textContent = tr('netBad');
        });
    } },
      h('label', { for:'p1' }, tr('p1')), p1,
      h('label', { for:'p2' }, tr('p2')), p2,
      btn, msg);
    view.appendChild(f);
    setTimeout(function(){ try { p1.focus(); } catch(_){} }, 60);
  }

  /* On valide AVANT d'afficher le formulaire : faire saisir deux fois un mot de
     passe pour apprendre ensuite que le lien était mort est une petite cruauté
     évitable. La validation ne consomme pas le jeton (GET). Sans jeton dans
     l'URL, on est là pour DEMANDER un lien (porte de compte, app native). */
  if (!token) { request(); }
  else {
    view.appendChild(h('p', { text:tr('checking') }));
    /* no-store explicite : la validité d'un lien change entre deux requêtes
       identiques, donc rien ne doit la mettre en cache, ni le service worker,
       ni le navigateur, ni un proxy en chemin. */
    fetch('/auth/reset?token=' + encodeURIComponent(token), { cache:'no-store', headers:{ Accept:'application/json' } })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.valid) form(); else dead(); })
      .catch(function(){ dead(); });
  }
})();
</script>
</body>
</html>
