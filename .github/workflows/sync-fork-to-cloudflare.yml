# Synchronisation · badro99/Kiwi ──► zaka33333-hash/Kiwi (sans aucun secret)
#
# Pourquoi ce fichier existe
# ──────────────────────────
# Le produit vit dans DEUX dépôts GitHub :
#   • badro99/Kiwi          — le dépôt de travail, celui où l'associé pousse
#   • zaka33333-hash/Kiwi   — le SEUL que Cloudflare Pages construit
#
# Le miroir voisin (mirror-to-cloudflare.yml) résout ce problème en poussant
# depuis badro99, mais il lui faut un jeton que personne n'a jamais créé. Il
# tourne donc, avertit, ne pousse rien — et se termine en VERT. Le 28/07/2026
# la production a dérivé cinq fois en une soirée pendant que ce miroir
# affichait « success » à chaque fois.
#
# Ce fichier prend le problème par l'autre bout. zaka33333-hash/Kiwi est un
# FORK de badro99/Kiwi, et les deux dépôts sont publics : GitHub sait donc
# faire l'avance rapide tout seul, avec le jeton automatique du dépôt. Aucun
# secret à créer, aucune permission à demander à l'associé, aucun réglage à
# changer chez Cloudflare.
#
# Où ce fichier doit vivre — et pourquoi ça compte
# ────────────────────────────────────────────────
# La synchronisation est une AVANCE RAPIDE : après coup, le main du fork est
# exactement celui de badro99. Un fichier qui n'existerait que dans le fork
# ferait donc diverger les deux branches, et l'API refuserait net la fois
# suivante. C'est pour cela que ce workflow est versionné sur le main de
# badro99 — le dépôt canonique — et qu'il arrive dans le fork par la
# synchronisation elle-même. Les deux main restent identiques au fichier près.
#
# La garde `if:` ci-dessous en est le corollaire : le fichier existe dans les
# deux dépôts, mais il ne doit s'exécuter que dans celui qui se synchronise.
#
# Ce qu'il ne fait pas
# ────────────────────
# Il n'y a pas de poussée forcée. Si les deux dépôts ont réellement divergé,
# GitHub refuse l'avance rapide et le job échoue bruyamment plutôt que
# d'écraser un historique : réconcilier une divergence reste une décision
# humaine.

name: Synchroniser le dépôt Cloudflare

on:
  schedule:
    # Toutes les cinq minutes. GitHub met en file d'attente les tâches
    # planifiées aux heures chargées : compter cinq à vingt minutes de retard
    # réel, pas cinq pile. C'est le prix d'une solution sans secret ; le
    # miroir instantané demanderait un jeton (voir mirror-to-cloudflare.yml).
    - cron: '*/5 * * * *'
  # Pour forcer la synchronisation sans attendre le prochain passage.
  workflow_dispatch:

concurrency:
  # Deux passages ne doivent pas se chevaucher : le second travaillerait sur
  # un état que le premier est en train de déplacer.
  group: sync-fork-to-cloudflare
  cancel-in-progress: false

jobs:
  sync:
    # Le fichier vit sur le main de badro99, donc il arrive aussi DANS le
    # fork. Sans cette garde, badro99 tenterait de se synchroniser sur
    # lui-même à chaque passage.
    if: github.repository == 'zaka33333-hash/Kiwi'
    runs-on: ubuntu-latest
    permissions:
      # Le seul droit nécessaire, et il est accordé automatiquement au dépôt
      # sur lui-même : aucun jeton personnel, aucun secret à enregistrer.
      contents: write
    steps:
      - name: Avance rapide sur le dépôt de travail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # UN SEUL appel, volontairement. L'appel EST la fusion : le refaire
          # pour « vérifier » ferait toujours répondre « déjà à jour » et
          # masquerait ce qui vient réellement de se passer.
          if body=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
                      -f branch=main 2>&1); then
            echo "$body"
            case "$body" in
              *fast-forward*)
                echo "Synchronisé. Cloudflare Pages déclenche son build."
                ;;
              *)
                # merge_type « none » : les deux dépôts étaient déjà au même
                # point. C'est le cas le plus fréquent — la plupart des
                # passages tournent à vide, c'est normal et sans effet.
                echo "Déjà à jour — rien à déployer."
                ;;
            esac
          else
            echo "$body"
            echo "::error::Synchronisation échouée — la production reste sur l'ancien commit."
            echo "Cause probable : les deux dépôts ont divergé (zaka33333-hash porte un"
            echo "commit absent de badro99). Aucune poussée forcée ne sera faite ;"
            echo "réconcilier deux historiques est une décision humaine."
            exit 1
          fi
