name: SEO et fraîcheur éditoriale

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-watch
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'badro99/Kiwi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier la génération éditoriale
        run: node tools/build-guides-check.mjs

      - name: Vérifier le contrat des articles et des sources
        run: node tools/article-template-test.mjs

      - name: Bloquer les sources juridiques vieilles de plus de 90 jours
        run: node tools/content-freshness-test.mjs --max-age-days=90

      - name: Tester les URL canoniques en production
        run: node tools/seo-live-test.mjs
