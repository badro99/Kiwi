name: Remove expired Kiwi tickets

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Delete tickets whose 20-day retention has ended
        run: curl --fail --silent --show-error --retry 3 --request POST https://app.kiwi.ma/api/tickets/cleanup
